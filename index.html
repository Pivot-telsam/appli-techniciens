<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sur le terrain — TELSAM</title>
<style>
:root{
  --bg:#0C1012;
  --surface:#171D1F;
  --surface-2:#1F2729;
  --border:#2B3436;
  --text:#EDEFEE;
  --text-muted:#8FA0A2;
  --amber:#FFB000;
  --amber-dim:#4A3A14;
  --cyan:#2FD8CB;
  --cyan-dim:#173733;
  --green:#4CAF6D;
  --green-bg:#132318;
  --orange:#F5A524;
  --orange-bg:#2A2013;
  --red:#F0555C;
  --red-bg:#2E1618;
  --red-border:#7A2A2E;
  --gray:#5B6668;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:40px;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
button{font-family:inherit;}
a{color:inherit;}

/* ---------- ligne signature (ambre -> cyan pointillé) ---------- */
.hv-line{
  height:3px;
  width:100%;
  background:linear-gradient(90deg, var(--amber) 0%, var(--amber) 45%, transparent 45%);
  position:relative;
  margin:0 0 2px 0;
}
.hv-line::after{
  content:'';
  position:absolute; left:45%; right:0; top:0; bottom:0;
  background-image:repeating-linear-gradient(90deg, var(--cyan) 0 6px, transparent 6px 12px);
}

/* ---------- écran de sélection technicien ---------- */
#pickScreen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:48px 20px 24px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}
.brand svg{flex:none;}
.brand-title{
  font-size:15px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--text-muted);
}
.pick-title{
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.01em;
  margin:18px 0 4px;
  text-align:center;
}
.pick-sub{
  color:var(--text-muted);
  font-size:14.5px;
  margin-bottom:28px;
  text-align:center;
}
.tech-grid{
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.tech-btn{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:12px;
  padding:16px 18px;
  font-size:17px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.tech-btn:active{background:var(--surface-2); border-color:var(--amber);}
.tech-btn .chev{color:var(--amber); font-size:18px;}

/* ---------- écran principal ---------- */
#appScreen{display:none; max-width:640px; margin:0 auto;}
header.top{
  position:sticky; top:0; z-index:5;
  background:var(--bg);
  padding:14px 16px 10px;
}
.top-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
.who{
  display:flex; flex-direction:column;
}
.who-label{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted); font-weight:700;}
.who-name{font-size:19px; font-weight:800; letter-spacing:-0.01em;}
.switch-btn{
  background:none; border:1px solid var(--border); color:var(--text-muted);
  border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer;
}
.week-nav{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:6px 6px 6px 14px;
}
.week-nav .lbl{font-size:15px; font-weight:700;}
.week-nav .sub{font-size:12px; color:var(--text-muted); margin-top:1px;}
.week-arrows{display:flex; gap:6px;}
.week-arrows button{
  width:38px; height:38px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:17px; cursor:pointer;
}
.week-tag{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:0.06em;
  text-transform:uppercase; padding:2px 7px; border-radius:100px; margin-top:4px;
}
.week-tag.now{background:var(--amber-dim); color:var(--amber);}
.week-tag.next{background:var(--cyan-dim); color:var(--cyan);}

main{padding:6px 16px 20px; display:flex; flex-direction:column; gap:14px;}

.empty{
  text-align:center; color:var(--text-muted); padding:60px 20px; font-size:14.5px;
}
.empty .big{font-size:40px; display:block; margin-bottom:10px;}

/* ---------- carte chantier ---------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px; display:flex; flex-direction:column; gap:10px;
}
.card-title{font-size:17px; font-weight:800; letter-spacing:-0.005em; line-height:1.25;}
.card-lieu{font-size:13.5px; color:var(--text-muted); display:flex; gap:6px; align-items:flex-start;}
.card-days{font-size:12px; color:var(--text-muted);}
.card-days .d{
  display:inline-block; background:var(--surface-2); border-radius:6px;
  padding:2px 6px; margin-right:4px; font-weight:700; color:var(--text);
}

.badges{display:flex; flex-wrap:wrap; gap:6px;}
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:12px; font-weight:700; padding:5px 9px; border-radius:8px;
  border:1px solid transparent;
}
.badge .dot{width:7px; height:7px; border-radius:50%; flex:none;}
.badge.ok{background:var(--green-bg); color:var(--green); border-color:#1E3D28;}
.badge.ok .dot{background:var(--green);}
.badge.warn{background:var(--orange-bg); color:var(--orange); border-color:#4A3717;}
.badge.warn .dot{background:var(--orange);}
.badge.bad{background:var(--red-bg); color:var(--red); border-color:var(--red-border);}
.badge.bad .dot{background:var(--red);}

.banner{
  border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.4;
}
.banner.red{background:var(--red-bg); border:1px solid var(--red-border); color:#FFD3D5;}
.banner.orange{background:var(--orange-bg); border:1px solid #4A3717; color:#FFE3B0;}
.banner.touret{background:var(--cyan-dim); border:1px solid #1F5750; color:#BFF3EE; font-weight:700;}

.doc-row{display:flex; gap:8px; flex-wrap:wrap;}
.doc-btn{
  flex:1; min-width:120px;
  display:flex; align-items:center; justify-content:center; gap:7px;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:11px 10px; font-size:13.5px; font-weight:700;
  text-decoration:none; cursor:pointer;
}
.doc-btn.amber{border-color:#5A4519; color:var(--amber);}
.doc-btn.cyan{border-color:#1F5750; color:var(--cyan);}
.doc-btn.disabled{color:var(--gray); border-color:var(--border); cursor:default; opacity:0.6;}
.doc-btn.map{border-color:var(--border); color:var(--text-muted);}
.doc-btn.photo{border-color:#1B4A2A; color:var(--green);}

footer.legend{
  max-width:640px; margin:8px auto 0; padding:0 16px;
  font-size:11.5px; color:var(--text-muted); text-align:center;
}

/* ---------- onglets Chantiers / Feuille d'heures ---------- */
.tab-row{
  display:flex; gap:8px; margin-top:10px;
}
.tab-btn{
  flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
  border-radius:10px; padding:10px 8px; font-size:13.5px; font-weight:700; cursor:pointer;
}
.tab-btn.active{ background:var(--amber-dim); border-color:#5A4519; color:var(--amber); }

/* ---------- feuille d'heures ---------- */
.h-section{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:14px; display:flex; flex-direction:column; gap:10px;
}
.h-section-title{ font-size:14.5px; font-weight:800; display:flex; align-items:center; justify-content:space-between; }
.h-chantier-name{ font-size:15.5px; font-weight:800; }
.h-chantier-lieu{ font-size:12.5px; color:var(--text-muted); }
.h-days-grid{
  display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;
}
.h-day-col{ display:flex; flex-direction:column; gap:3px; align-items:center; }
.h-day-lbl{ font-size:10px; color:var(--text-muted); font-weight:700; }
.h-num{
  width:100%; max-width:40px; text-align:center; background:var(--surface-2); color:var(--text);
  border:1px solid var(--border); border-radius:6px; padding:5px 2px; font-size:12.5px;
}
.h-num.nuit{ opacity:0.75; }
.h-row-actions{ display:flex; justify-content:flex-end; }
.h-del-btn{
  background:none; border:none; color:var(--gray); font-size:13px; cursor:pointer; padding:2px 6px;
}
.h-add-btn{
  background:var(--surface-2); border:1px dashed var(--border); color:var(--text-muted);
  border-radius:10px; padding:10px; font-size:13px; font-weight:700; cursor:pointer; text-align:center;
}
.h-picker{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:9px; font-size:13.5px; width:100%;
}
.h-absence-row{ display:flex; flex-direction:column; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.h-absence-row:last-child{ border-bottom:none; padding-bottom:0; }
.h-absence-title{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; font-weight:700; }
.h-toggle-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.h-toggle-btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
  border-radius:8px; padding:8px 2px; font-size:11px; font-weight:800; cursor:pointer; text-align:center;
}
.h-toggle-btn.pd{ background:var(--amber-dim); border-color:#5A4519; color:var(--amber); }
.h-toggle-btn.gd{ background:var(--cyan-dim); border-color:#1F5750; color:var(--cyan); }
.h-toggle-btn.n1{ background:var(--amber-dim); border-color:#5A4519; color:var(--amber); }
.h-toggle-btn.n2{ background:var(--red-bg); border-color:var(--red-border); color:var(--red); }
.h-veh-row{ display:flex; gap:8px; }
.h-veh-btn{
  flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
  border-radius:10px; padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; text-align:center;
}
.h-veh-btn.active{ background:var(--amber-dim); border-color:#5A4519; color:var(--amber); }
.h-km-input{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:10px; font-size:13.5px; width:100%;
}
.h-textarea{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:10px; font-size:13.5px; width:100%; min-height:64px; resize:vertical;
  font-family:inherit;
}
.h-send-btn{
  background:var(--amber); color:#1A1200; border:none; border-radius:12px;
  padding:15px; font-size:15.5px; font-weight:800; cursor:pointer; text-align:center;
}
.h-send-btn:active{ opacity:0.85; }
.h-send-btn.secondary-link{ background:none; border:1px solid var(--border); color:var(--text-muted); font-size:13px; padding:11px; }
.h-send-sub{ font-size:12px; color:var(--text-muted); text-align:center; }
.h-saved-tag{ font-size:11px; color:var(--green); font-weight:700; }
.gate-input{
  width:100%; max-width:280px; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:12px; padding:14px; font-size:18px; text-align:center; letter-spacing:0.15em;
  margin-top:6px;
}
.gate-btn{
  width:100%; max-width:280px; background:var(--amber); color:#1A1200; border:none;
  border-radius:12px; padding:14px; font-size:15.5px; font-weight:800; cursor:pointer; margin-top:12px;
}
.gate-error{ color:var(--red); font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>

<div id="gateScreen" style="min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 20px 24px;">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <path d="M14 2L4 14H12L10 24L22 10H14L16 2Z" fill="#FFB000"/>
    </svg>
    <span class="brand-title">TELSAM · Terrain</span>
  </div>
  <div class="pick-title">Accès protégé</div>
  <div class="pick-sub">Entre le code fourni par Patrice</div>
  <input type="password" id="gateInput" class="gate-input" placeholder="Code d'accès" autocomplete="off">
  <button id="gateBtn" class="gate-btn">Valider</button>
  <div id="gateError" class="gate-error">Code incorrect, réessaie.</div>
</div>

<div id="pickScreen" style="display:none;">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
      <path d="M14 2L4 14H12L10 24L22 10H14L16 2Z" fill="#FFB000"/>
    </svg>
    <span class="brand-title">TELSAM · Terrain</span>
  </div>
  <div class="pick-title">Qui es-tu ?</div>
  <div class="pick-sub">Choisis ton nom pour voir tes chantiers</div>
  <div class="tech-grid" id="techGrid"></div>
</div>

<div id="appScreen">
  <header class="top">
    <div class="top-row">
      <div class="who">
        <span class="who-label">Technicien</span>
        <span class="who-name" id="whoName">—</span>
      </div>
      <button class="switch-btn" id="switchBtn">Changer</button>
    </div>
    <div class="week-nav">
      <div>
        <div class="lbl" id="weekLbl">Semaine —</div>
        <div class="sub" id="weekSub">— au —</div>
        <span class="week-tag now" id="weekTagNow" style="display:none;">Cette semaine</span>
        <span class="week-tag next" id="weekTagNext" style="display:none;">Semaine prochaine</span>
      </div>
      <div class="week-arrows">
        <button id="prevWeek" aria-label="Semaine précédente">‹</button>
        <button id="nextWeek" aria-label="Semaine suivante">›</button>
      </div>
    </div>
  </header>
  <div class="tab-row">
    <button class="tab-btn active" id="tabChantiers">Chantiers</button>
    <button class="tab-btn" id="tabHeures">Ma feuille d'heures</button>
    <button class="tab-btn" id="tabHabilitations">Habilitations</button>
  </div>
  <main id="cardList"></main>
  <main id="hoursPanel" style="display:none;"></main>
  <main id="habilitationsPanel" style="display:none;"></main>
</div>

<footer class="legend" id="legend"></footer>

/* ---------- IndexedDB minimal (persistance du technicien choisi sur ce téléphone) ---------- */
const IDB_NAME='terrain_telsam_db', IDB_STORE='kv';
let _idbP=null;
function idbOpen(){
  if(_idbP) return _idbP;
  _idbP=new Promise((res,rej)=>{
    if(!('indexedDB' in window)){rej(new Error('no idb'));return;}
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return _idbP;
}
async function kvGet(k){
  try{const db=await idbOpen();return await new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const rq=tx.objectStore(IDB_STORE).get(k);
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });}catch(e){return undefined;}
}
async function kvSet(k,v){
  try{const db=await idbOpen();await new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(v,k);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });}catch(e){}
}

/* ---------- semaines ISO (même logique que le suivi principal) ---------- */
function isoWeekInfo(date){
  const d=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate()));
  const dayNum=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const firstDayNum=(firstThursday.getUTCDay()+6)%7;
  firstThursday.setUTCDate(firstThursday.getUTCDate()-firstDayNum+3);
  const week=1+Math.round((d-firstThursday)/(7*86400000));
  return {week, year:d.getUTCFullYear()};
}
function mondayOfISOWeek(week,year){
  const simple=new Date(Date.UTC(year,0,1+(week-1)*7));
  const dow=simple.getUTCDay()||7;
  simple.setUTCDate(simple.getUTCDate()-dow+1);
  return simple;
}
function fmtDate(d){
  return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');
}
const JOURS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

let currentOffset=0; // 0 = semaine courante, +1 = suivante, -1 = précédente...
let currentTech=null;

function weekRange(offset){
  const today=new Date();
  const base=new Date(Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()));
  const {week,year}=isoWeekInfo(base);
  let mon=mondayOfISOWeek(week,year);
  mon.setUTCDate(mon.getUTCDate()+offset*7);
  const sun=new Date(mon); sun.setUTCDate(sun.getUTCDate()+6);
  const info=isoWeekInfo(mon);
  return {mon, sun, weekNum:info.week, year:info.year};
}

function isoDatesInRange(dates, mon, sun){
  return dates.filter(iso=>{
    const d=new Date(iso+'T00:00:00Z');
    return d>=mon && d<=sun;
  }).sort();
}

function dayLabel(iso){
  const d=new Date(iso+'T00:00:00Z');
  const dow=(d.getUTCDay()+6)%7;
  return JOURS[dow];
}

function chantierById(id){
  return SEED_DATA.find(c=>c.id===id);
}

function slugify(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
}
const TECH_SLUGS = {};
TECHS.forEach(t=>{ TECH_SLUGS[slugify(t)] = t; });
let lockedByUrl=false;

function renderTechGrid(){
  const grid=document.getElementById('techGrid');
  grid.innerHTML='';
  TECHS.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='tech-btn';
    btn.innerHTML='<span>'+t+'</span><span class="chev">›</span>';
    btn.onclick=()=>selectTech(t);
    grid.appendChild(btn);
  });
}

}

function statusBadge(kind, label, statut){
  if(statut==='na' || statut==='nc') return '';
  const lvl = statut==='ok' ? 'ok' : (statut==='warn' ? 'warn' : (statut==='bad' ? 'bad' : 'warn'));
  const txt = STATUS_LABEL[statut] || statut;
  return '<span class="badge '+lvl+'"><span class="dot"></span>'+label+' · '+txt+'</span>';
}

function renderCard(c, daysThisWeek){
  const days = daysThisWeek.map(iso=>'<span class="d">'+dayLabel(iso)+' '+fmtDate(new Date(iso+'T00:00:00Z'))+'</span>').join('');

  let bannersHtml='';
  // Consignation et NIP toujours en rouge (règle impérative)
  if(c.consignation && c.consignation.length){
    bannersHtml += '<div class="banner red"><strong>⚠ Consignation (OPPC)</strong><br>'+c.consignation.join('<br>')+'</div>';
  }
  if(c.nip && c.nip.length){
    bannersHtml += '<div class="banner red"><strong>⚠ NIP</strong><br>'+c.nip.join('<br>')+'</div>';
  }
  // Alertes bad/warn
  (c.alertes||[]).forEach(a=>{
    const cls = a.level==='bad' ? 'red' : 'orange';
    bannersHtml += '<div class="banner '+cls+'">'+a.text+'</div>';
  });

  let badgesHtml='';

function render(){
  const {mon, sun, weekNum, year} = weekRange(currentOffset);
  document.getElementById('weekLbl').textContent = 'Semaine '+weekNum;
  document.getElementById('weekSub').textContent = fmtDate(mon)+' au '+fmtDate(sun)+' '+year;
  document.getElementById('weekTagNow').style.display = currentOffset===0 ? 'inline-block':'none';
  document.getElementById('weekTagNext').style.display = currentOffset===1 ? 'inline-block':'none';

  const list=document.getElementById('cardList');
  const cards=[];
  for(const cid in TECH_RANGES){
    const techDates = TECH_RANGES[cid][currentTech];
    if(!techDates) continue;
    const daysThisWeek = isoDatesInRange(techDates, mon, sun);
    if(daysThisWeek.length===0) continue;
    const c = chantierById(cid);
    if(!c) continue;
    cards.push({c, daysThisWeek, firstDay: daysThisWeek[0]});
  }
  cards.sort((a,b)=> a.firstDay.localeCompare(b.firstDay));

  if(cards.length===0){
    list.innerHTML = '<div class="empty"><span class="big">🗓️</span>Rien de prévu pour toi cette semaine-là.</div>';
    return;
  }
  list.innerHTML = cards.map(x=>renderCard(x.c, x.daysThisWeek)).join('');
}

function getWeekChantiers(tech, mon, sun){
  const result=[];
  for(const cid in TECH_RANGES){
    const techDates = TECH_RANGES[cid][tech];
    if(!techDates) continue;
    const days = isoDatesInRange(techDates, mon, sun);
    if(days.length===0) continue;
    const c = chantierById(cid);
    if(!c) continue;
    result.push({id:c.id, nom:c.nom, lieu:c.lieu||'', client:c.client||'', firstDay:days[0]});
  }
  result.sort((a,b)=>a.firstDay.localeCompare(b.firstDay));
  return result;
}

async function ensureFeuilleForWeek(tech, weekInfo){
  const key = 'fh_'+tech+'_'+weekInfo.year+'_'+weekInfo.weekNum;
  let entry = await kvGet(key);
  const weekChantiers = getWeekChantiers(tech, weekInfo.mon, weekInfo.sun);
  if(!entry){
    entry = { chantierLines:[], removedAutoIds:[], absences:[], pd:{}, gd:{}, nacelle:{}, vehiculeMode:null, km:'', immat:'', commentaires:'' };
  }
  // Nettoyage : "Contribution agence" ne doit plus jamais apparaître automatiquement sous Absences
  // (l'ancien système la sauvegardait là), ni persister toute seule d'une semaine à l'autre.
  // Elle n'est légitime que si elle a été ajoutée volontairement via "+ Ajouter un chantier"
  // (marquée addedManually) — toute autre occurrence est un résidu de l'ancien système, à retirer.
  entry.absences = entry.absences.filter(a=>a.key!=='contribution');
  entry.chantierLines = entry.chantierLines.filter(l=> l.id!=='__contribution_agence__' || l.addedManually===true);
  const existingIds = new Set(entry.chantierLines.filter(l=>l.id).map(l=>l.id));
  weekChantiers.forEach(wc=>{
    if(!existingIds.has(wc.id) && entry.removedAutoIds.indexOf(wc.id)===-1){
      entry.chantierLines.push({id:wc.id, nom:wc.nom, lieu:wc.lieu, client:wc.client, jours:{}});
    }
  });
  hoursKeyCurrent = key;
  hoursEntry = entry;
  await kvSet(key, entry);
}

  loadJSZipLib().catch(()=>{ /* pas grave si ça échoue ici, generateFeuilleFile réessaiera au clic */ });
  loadPdfLib().catch(()=>{ /* idem pour le PDF */ });
}

function scheduleSaveHours(){
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{ if(hoursKeyCurrent && hoursEntry) kvSet(hoursKeyCurrent, hoursEntry); }, 400);
}

/* ---- chantiers ---- */
function updateChantierHour(idx, dayIdx, kind, value){
  const line = hoursEntry.chantierLines[idx];
  if(!line) return;
  if(!line.jours) line.jours={};
  if(!line.jours[dayIdx]) line.jours[dayIdx]={};
  line.jours[dayIdx][kind] = value;
  scheduleSaveHours();
}
function removeChantierLine(idx){
  const line = hoursEntry.chantierLines[idx];
  if(line && line.id) hoursEntry.removedAutoIds.push(line.id);
  hoursEntry.chantierLines.splice(idx,1);
  scheduleSaveHours();
  renderHoursUI();
}
function addChantierStart(){ addingChantier=true; renderHoursUI(); }
function addChantierCancel(){ addingChantier=false; renderHoursUI(); }
function addChantierConfirm(){
  const sel = document.getElementById('addChantierSelect');
  const val = sel ? sel.value : '';
  addingChantier=false;
  if(val==='__autre__'){
    const nom = prompt('Nom du chantier :');
    if(nom){
      const lieu = prompt('Lieu (optionnel) :') || '';
      hoursEntry.chantierLines.push({id:null, nom, lieu, client:'', jours:{}});
      scheduleSaveHours();
    }
  } else if(val==='__contribution_agence__'){
    hoursEntry.chantierLines.push({id:'__contribution_agence__', addedManually:true, nom:'Contribution agence', lieu:'', client:'', jours:{}});
    scheduleSaveHours();
  } else if(val){
    const c = chantierById(val);
    if(c) hoursEntry.chantierLines.push({id:c.id, nom:c.nom, lieu:c.lieu||'', client:c.client||'', jours:{}});
    scheduleSaveHours();
  }
  renderHoursUI();
}

/* ---- absences ---- */
function updateAbsenceHour(idx, dayIdx, value){
  const abs = hoursEntry.absences[idx];
  if(!abs) return;
  if(!abs.jours) abs.jours={};
  abs.jours[dayIdx]=value;
  scheduleSaveHours();
}
function removeAbsence(idx){
  hoursEntry.absences.splice(idx,1);
  scheduleSaveHours();
  renderHoursUI();
}
function addAbsenceStart(){ addingAbsence=true; renderHoursUI(); }
function addAbsenceCancel(){ addingAbsence=false; renderHoursUI(); }
function addAbsenceConfirm(){
  const sel = document.getElementById('addAbsenceSelect');
  const val = sel ? sel.value : '';
  addingAbsence=false;
  if(val){
    hoursEntry.absences.push({key:val, jours:{}});
    scheduleSaveHours();
  }

}

/* ---- déplacement / nacelle ---- */
function cycleDeplacement(dayIdx){
  const cur = hoursEntry.pd[dayIdx] ? 'PD' : (hoursEntry.gd[dayIdx] ? 'GD' : null);
  delete hoursEntry.pd[dayIdx];
  delete hoursEntry.gd[dayIdx];
  if(cur===null) hoursEntry.pd[dayIdx]=1;
  else if(cur==='PD') hoursEntry.gd[dayIdx]=1;
  scheduleSaveHours();
  renderHoursUI();
}
function cycleNacelle(dayIdx){
  const cur = hoursEntry.nacelle[dayIdx] || 0;
  const next = cur===0?1:(cur===1?2:0);
  if(next===0) delete hoursEntry.nacelle[dayIdx]; else hoursEntry.nacelle[dayIdx]=next;
  scheduleSaveHours();
  renderHoursUI();
}

/* ---- véhicule / commentaires ---- */
function setVehiculeMode(mode){
  hoursEntry.vehiculeMode = hoursEntry.vehiculeMode===mode ? null : mode;
  scheduleSaveHours();
  renderHoursUI();
}
function updateKm(value){ hoursEntry.km=value; scheduleSaveHours(); }
function updateImmat(value){ hoursEntry.immat=value; scheduleSaveHours(); }
function updateCommentaires(value){ hoursEntry.commentaires=value; scheduleSaveHours(); }

/* ---- export Excel (manipulation XML directe : préserve 100% la mise en forme d'origine) ---- */
function loadJSZipLib(){
  if(window.JSZip) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>res();
    s.onerror=()=>rej(new Error('Connexion internet nécessaire pour générer le fichier Excel (une seule fois).'));
    document.head.appendChild(s);
  });
}
function toExcelSerial(date){
  const epoch = Date.UTC(1899,11,30);
  return Math.round((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - epoch) / 86400000);
}
function xmlEscape(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function replaceCellXML(xml, addr, buildTag){
  const re = new RegExp('<c r="'+addr+'"[^>]*?(?:/>|>[\\s\\S]*?<\\/c>)');
  const m = xml.match(re);
  if(!m) return xml; // ne devrait pas arriver pour les adresses connues du modèle
  const original = m[0];
  const styleMatch = original.match(/\ss="(\d+)"/);
  const styleAttr = styleMatch ? ' s="'+styleMatch[1]+'"' : '';
  const newTag = buildTag(styleAttr);
  return xml.slice(0, m.index) + newTag + xml.slice(m.index + original.length);
}
function setNumberCellXML(xml, addr, value){
  return replaceCellXML(xml, addr, (s)=> '<c r="'+addr+'"'+s+'><v>'+value+'</v></c>');
}
function setTextCellXML(xml, addr, text){
  return replaceCellXML(xml, addr, (s)=> '<c r="'+addr+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(text)+'</t></is></c>');
}
function setFormulaCellXML(xml, addr, formula){
  return replaceCellXML(xml, addr, (s)=> '<c r="'+addr+'"'+s+'><f>'+xmlEscape(formula)+'</f></c>');
}
function applyPayloadToSheetXML(xml, payload){
  xml = setNumberCellXML(xml, 'F3', payload.weekNum);
  xml = setNumberCellXML(xml, 'I3', toExcelSerial(payload.mondayDate));
  xml = setFormulaCellXML(xml, 'M3', 'I3+6'); // absente du modèle vierge, ajoutée nous-mêmes
  xml = setTextCellXML(xml, 'F5', payload.nom);
  xml = setTextCellXML(xml, 'M5', payload.prenom);

  const chantierRows = [16].concat(CHANTIER_EXTRA_ROWS);
  payload.chantierLines.forEach((line, idx)=>{
    if(idx>=chantierRows.length) return;
    const row = chantierRows[idx];
    if(line.client) xml = setTextCellXML(xml, 'B'+row, line.client);
    if(line.lieu) xml = setTextCellXML(xml, 'C'+row, line.lieu);
    DAY_COLS.forEach((cols, d)=>{
      const h = line.jours && line.jours[d];
      if(h && h.j) xml = setNumberCellXML(xml, cols.j+row, h.j);
      if(h && h.n) xml = setNumberCellXML(xml, cols.n+row, h.n);
    });
  });

  (payload.absences||[]).forEach(abs=>{
    const row = ABSENCE_ROWS[abs.key];
    if(!row) return;
    DAY_COLS.forEach((cols, d)=>{
      const h = abs.jours && abs.jours[d];
      if(h) xml = setNumberCellXML(xml, cols.j+row, h);
    });
  });

  DAY_COLS.forEach((cols, d)=>{
    if(payload.pd && payload.pd[d]) xml = setNumberCellXML(xml, cols.j+'41', 1);
    if(payload.gd && payload.gd[d]) xml = setNumberCellXML(xml, cols.j+'42', 1);
    if(payload.nacelle && payload.nacelle[d]) xml = setNumberCellXML(xml, cols.j+'40', payload.nacelle[d]);
  });

  if(payload.vehiculeMode==='TELSAM') xml = setTextCellXML(xml, 'I51', 'X');
  if(payload.vehiculeMode==='LOCATION') xml = setTextCellXML(xml, 'I52', 'X');
  if(payload.km) xml = setNumberCellXML(xml, 'J52', payload.km);
  if(payload.immat) xml = setTextCellXML(xml, 'A52', payload.immat);
  if(payload.commentaires) xml = setTextCellXML(xml, 'J47', 'Commentaires : '+payload.commentaires);
  if(payload.signatureText) xml = setTextCellXML(xml, 'D47', payload.signatureText);
  xml = setFormulaCellXML(xml, 'D49', 'TODAY()'); // absente du modèle vierge, ajoutée nous-mêmes

  return xml;
}

function splitTechName(full){
  const tokens = full.trim().split(/\s+/);
  const nomTokens=[];
  while(tokens.length>1 && tokens[tokens.length-1]===tokens[tokens.length-1].toUpperCase()){
    nomTokens.unshift(tokens.pop());
  }
  if(nomTokens.length===0 && tokens.length) nomTokens.unshift(tokens.pop());
  return { nom: nomTokens.join(' '), prenom: tokens.join(' ') };
}
function titleCase(s){
  return s.split(/\s+/).map(w=> w.length? w.charAt(0).toUpperCase()+w.slice(1).toLowerCase() : w).join(' ');
}
function buildExportPayload(mon, weekNum){
  const {nom, prenom} = splitTechName(currentTech);
  const nomTitle = titleCase(nom);
  const prenomTitle = titleCase(prenom);
  const chantierLines = hoursEntry.chantierLines
    .filter(line=> line.id!=='__contribution_agence__')
    .map(line=>{
      const jours={};
      for(let d=0; d<7; d++){
        const h = line.jours && line.jours[d];
        if(h && (h.j || h.n)){
          jours[d] = {
            j: h.j? parseFloat(String(h.j).replace(',','.')) : null,
            n: h.n? parseFloat(String(h.n).replace(',','.')) : null,
          };
        }
      }
      return { client: line.client||'', lieu: line.lieu||'', jours };
    });
  const absences = (hoursEntry.absences||[]).map(a=>{
    const jours={};
    for(let d=0; d<7; d++){
      const h = a.jours && a.jours[d];
      if(h) jours[d] = parseFloat(String(h).replace(',','.'));
    }
    return { key:a.key, jours };
  });
  // La "Contribution agence" est saisie comme un chantier dans l'interface (plus pratique pour le
  // technicien), mais elle doit remonter dans sa case dédiée du document officiel, pas comme chantier.
  const contribLine = hoursEntry.chantierLines.find(l=> l.id==='__contribution_agence__');
  if(contribLine){
    const jours={};
    for(let d=0; d<7; d++){
      const h = contribLine.jours && contribLine.jours[d];
      const total = (h && h.j? parseFloat(String(h.j).replace(',','.')) : 0) + (h && h.n? parseFloat(String(h.n).replace(',','.')) : 0);
      if(total) jours[d] = total;
    }
    if(Object.keys(jours).length) absences.push({ key:'contribution', jours });
  }
  return {
    weekNum, mondayDate: mon,
    nom: nomTitle, prenom: prenomTitle,
    chantierLines, absences,
    pd: hoursEntry.pd||{}, gd: hoursEntry.gd||{}, nacelle: hoursEntry.nacelle||{},
    vehiculeMode: hoursEntry.vehiculeMode||null,
    km: hoursEntry.km||null,
    immat: hoursEntry.immat||null,
    commentaires: hoursEntry.commentaires||'',
    signatureText: nomTitle+' '+prenomTitle,
    sheetName: 'S'+weekNum+'-'+nom.toUpperCase()+'_'+prenomTitle.replace(/\s+/g,''),
  };
}
async function generateFeuilleFile(){
  await loadJSZipLib();
  const {mon, weekNum} = weekRange(currentOffset);
  const payload = buildExportPayload(mon, weekNum);
  const zip = await window.JSZip.loadAsync(FEUILLE_TEMPLATE_B64, {base64:true});
  let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');
  xml = applyPayloadToSheetXML(xml, payload);
  zip.file('xl/worksheets/sheet1.xml', xml);
  // le nom de l'onglet interne n'est jamais modifié (des références internes au classeur le ciblent par son nom d'origine)
  const blob = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const filename = payload.sheetName + '.xlsx';
  return { blob, filename, weekNum };
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
}
async function downloadExcelFeuille(){
  const btn = document.getElementById('excelBtn');
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Génération...'; }
  try{
    const {blob, filename} = await generateFeuilleFile();
    downloadBlob(blob, filename);
  }catch(err){
    alert('Erreur lors de la génération du fichier : '+(err && err.message ? err.message : err));
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=originalLabel||'📊 Télécharger aussi le fichier Excel officiel'; }
  }
}

/* ---- export PDF (résumé lisible, utilisé pour le partage automatique — plus compatible que l'Excel) ---- */
function loadPdfLib(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s1=document.createElement('script');
    s1.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s1.onload=()=>{
      const s2=document.createElement('script');
      s2.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
      s2.onload=()=>res();
      s2.onerror=()=>rej(new Error('Connexion internet nécessaire pour générer le PDF (une seule fois).'));
      document.head.appendChild(s2);
    };
    s1.onerror=()=>rej(new Error('Connexion internet nécessaire pour générer le PDF (une seule fois).'));
    document.head.appendChild(s1);
  });
}
const DAY_COLS_LABELS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const PDF_AMBER = [255,176,0];
const PDF_DARK = [12,16,18];
const PDF_DARK2 = [23,29,31];
const PDF_TEXT_MUTED = [110,120,122];
const PDF_BORDER = [225,228,229];
function fmtHeureCell(h){
  if(!h) return '';
  const j = h.j || 0, n = h.n || 0;
  if(j && n) return j+' + '+n+'n';
  if(j) return String(j);
  if(n) return n+'n';
  return '';
}
function fmtDateFR(d){
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function pdfEnsureSpace(doc, y, needed, pageHeight){
  if(y + needed > pageHeight - 15){ doc.addPage(); return 18; }
  return y;
}
function buildPdfFromPayload(payload){
  const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const marginX = 12;

  const bandH = 30;
  doc.setFillColor(PDF_DARK[0],PDF_DARK[1],PDF_DARK[2]);
  doc.rect(0, 0, pageWidth, bandH, 'F');
  try{
    const logoW = 38, logoH = logoW*(291/550);
    doc.addImage(TELSAM_LOGO_B64, 'JPEG', marginX, (bandH-logoH)/2, logoW, logoH);
  }catch(e){ /* logo optionnel : on continue sans si l'image pose problème */ }
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.text("Releve d'heures", marginX+46, 14);
  doc.setTextColor(PDF_AMBER[0],PDF_AMBER[1],PDF_AMBER[2]);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10.5);
  const sunday = new Date(payload.mondayDate); sunday.setDate(sunday.getDate()+6);
  doc.text('Semaine '+payload.weekNum+'  -  du '+fmtDateFR(payload.mondayDate)+' au '+fmtDateFR(sunday), marginX+46, 21.5);
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text(payload.nom+' '+payload.prenom, marginX+46, 27.5);

  const head = [['', ''].concat(DAY_COLS_LABELS).concat(['Total'])];
  const body = [];
  const dayTotals = [0,0,0,0,0,0,0];
  let grandTotal = 0;

  payload.chantierLines.forEach(line=>{
    const row = [line.lieu || line.client || 'Chantier', ''];
    let rowTotal = 0;
    for(let d=0; d<7; d++){
      const h = line.jours && line.jours[d];
      const val = (h && h.j || 0) + (h && h.n || 0);
      rowTotal += val; dayTotals[d]+=val;
      row.push(fmtHeureCell(h));
    }
    row.push(rowTotal>0 ? String(rowTotal) : '');
    grandTotal += rowTotal;
    body.push(row);
  });
  const nChantierRows = body.length;
  (payload.absences||[]).forEach(abs=>{
    const label = (ABSENCE_CODES.find(a=>a.key===abs.key)||{}).label || abs.key;
    const row = [label, ''];
    let rowTotal = 0;
    for(let d=0; d<7; d++){
      const val = (abs.jours && abs.jours[d]) || 0;
      rowTotal += val; dayTotals[d]+=val;
      row.push(val ? String(val) : '');
    }
    row.push(rowTotal>0 ? String(rowTotal) : '');
    grandTotal += rowTotal;
    body.push(row);
  });
  const totalRow = ['TOTAL',''].concat(dayTotals.map(v=> v>0? String(v):'')).concat([String(grandTotal)]);

  doc.autoTable({
    startY: bandH+8,
    head, body, foot:[totalRow],
    theme:'grid',
    styles:{ font:'helvetica', fontSize:9, cellPadding:2.2, halign:'center', lineColor:PDF_BORDER, lineWidth:0.15 },
    headStyles:{ fillColor:PDF_DARK2, textColor:255, fontStyle:'bold', fontSize:9 },
    footStyles:{ fillColor:PDF_DARK, textColor:PDF_AMBER, fontStyle:'bold', fontSize:9.5 },
    bodyStyles:{ textColor:[35,40,42] },
    alternateRowStyles:{ fillColor:[246,247,247] },
    columnStyles:{ 0:{ halign:'left', cellWidth:52, fontStyle:'bold' }, 1:{ cellWidth:0.1 } },
    margin:{ left:marginX, right:marginX },
    didParseCell: function(data){
      if(data.section==='body' && data.row.index===nChantierRows-1 && nChantierRows>0 && nChantierRows<body.length){
        data.cell.styles.lineWidth = { top:0.15, bottom:0.6, left:0.15, right:0.15 };
        data.cell.styles.lineColor = { bottom: PDF_AMBER };
      }
    },
  });

  let y = doc.lastAutoTable.finalY + 7;

  const depl = [];
  DAY_COLS_LABELS.forEach((lbl,d)=>{
    if(payload.pd && payload.pd[d]) depl.push(lbl+' (PD)');
    if(payload.gd && payload.gd[d]) depl.push(lbl+' (GD)');
  });
  const nacelle = [];
  DAY_COLS_LABELS.forEach((lbl,d)=>{ if(payload.nacelle && payload.nacelle[d]) nacelle.push(lbl+' ('+payload.nacelle[d]+')'); });
  const vehLine = (payload.vehiculeMode || payload.km || payload.immat)
    ? (payload.vehiculeMode||'Non precise')
      + (payload.immat ? '   -   Immatriculation : '+payload.immat : '')
      + (payload.km ? '   -   Km fin de semaine : '+payload.km : '')
    : null;

  const infoItems = [];
  if(depl.length) infoItems.push(['Deplacement', depl.join(', ')]);
  if(nacelle.length) infoItems.push(['Nacelle', nacelle.join(', ')]);
  if(vehLine) infoItems.push(['Vehicule', vehLine]);

  if(infoItems.length){
    y = pdfEnsureSpace(doc, y, 8+infoItems.length*7, pageHeight);
    const boxH = 6 + infoItems.length*7;
    doc.setFillColor(248,249,249);
    doc.setDrawColor(PDF_BORDER[0],PDF_BORDER[1],PDF_BORDER[2]);
    doc.roundedRect(marginX, y, pageWidth-2*marginX, boxH, 2, 2, 'FD');
    let iy = y+7;
    infoItems.forEach(([label,val])=>{
      doc.setFont('helvetica','bold');
      doc.setFontSize(9.5);
      doc.setTextColor(60,66,68);
      doc.text(label+' :', marginX+5, iy);
      doc.setFont('helvetica','normal');
      doc.setTextColor(35,40,42);
      doc.text(val, marginX+38, iy);
      iy += 7;
    });
    y += boxH + 6;
  }

  if(payload.commentaires){
    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    const lines = doc.splitTextToSize(payload.commentaires, pageWidth-2*marginX-10);
    const boxH = 10 + lines.length*4.6;
    y = pdfEnsureSpace(doc, y, boxH+4, pageHeight);
    doc.setFillColor(255,251,240);
    doc.setDrawColor(PDF_AMBER[0],PDF_AMBER[1],PDF_AMBER[2]);
    doc.roundedRect(marginX, y, pageWidth-2*marginX, boxH, 2, 2, 'FD');
    doc.setFont('helvetica','bold');
    doc.setFontSize(9);
    doc.setTextColor(150,110,0);
    doc.text('COMMENTAIRES', marginX+5, y+6);
    doc.setFont('helvetica','normal');
    doc.setTextColor(60,60,60);
    doc.setFontSize(9.5);
    doc.text(lines, marginX+5, y+11.5);
    y += boxH + 6;
  }

  y = pdfEnsureSpace(doc, y, 14, pageHeight);
  doc.setDrawColor(PDF_BORDER[0],PDF_BORDER[1],PDF_BORDER[2]);
  doc.line(marginX, y, pageWidth-marginX, y);
  y += 6;
  doc.setFont('helvetica','italic');
  doc.setFontSize(9.5);
  doc.setTextColor(90,96,98);
  doc.text('Signe electroniquement par '+payload.signatureText+' le '+fmtDateFR(new Date())+'.', marginX, y);

  const pageCount = doc.internal.getNumberOfPages();
  for(let p=1; p<=pageCount; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.5);
    doc.setTextColor(PDF_TEXT_MUTED[0],PDF_TEXT_MUTED[1],PDF_TEXT_MUTED[2]);
    doc.text("Genere depuis l'appli technicien TELSAM", marginX, pageHeight-8);
    doc.text('Page '+p+'/'+pageCount, pageWidth-marginX, pageHeight-8, {align:'right'});
  }

  return doc;
}
async function generateFeuillePDF(){
  await loadPdfLib();
  const {mon, weekNum} = weekRange(currentOffset);
  const payload = buildExportPayload(mon, weekNum);
  const doc = buildPdfFromPayload(payload);
  const blob = doc.output('blob');
  const filename = payload.sheetName + '.pdf';
  return { blob, filename, weekNum };
}
async function emailFeuille(){
  if(!hoursEntry) return;
  const btn = document.getElementById('emailBtn');
  const originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Génération...'; }
  try{
    const {blob, filename, weekNum} = await generateFeuillePDF();
    let shared=false;
    let cancelled=false;
    if(navigator.share){
      try{
        const file = new File([blob], filename, {type: blob.type});
        // certains navigateurs n'exposent pas canShare correctement : on tente quand même
        // le partage dans ce cas, plutôt que d'abandonner sans essayer.
        const canTry = navigator.canShare ? navigator.canShare({files:[file]}) : true;
        if(canTry){
          await navigator.share({files:[file], title: filename, text: "Feuille d'heures - "+currentTech});
          shared=true;
        }
      }catch(e){
        // AbortError = la personne a annulé volontairement le partage : on respecte son choix, pas de repli.
        if(e && e.name==='AbortError') cancelled=true;
      }
    }
    if(!shared && !cancelled){
      // Le partage automatique n'est pas possible sur ce téléphone : on télécharge le fichier.
      // Étape clé : il faut l'OUVRIR (pas juste le laisser dans les téléchargements) pour que
      // l'application qui s'ouvre propose son propre bouton Partager, fiable sur tous les téléphones.
      downloadBlob(blob, filename);
      const subject = 'Feuille d\'heures S'+weekNum+' - '+currentTech;
      const body = 'Bonjour,\n\nLe fichier "'+filename+'" vient d\'être téléchargé sur ce téléphone.\n\nPour l\'envoyer avec la pièce jointe : ouvre d\'abord ce fichier (notification de téléchargement), puis utilise le bouton Partager de l\'application qui s\'affiche.\n\nCordialement,\n'+currentTech;
      const mailto = 'mailto:equipefibretelsam@telsam.com'
        + '?subject='+encodeURIComponent(subject)
        + '&body='+encodeURIComponent(body);
      setTimeout(()=>{ window.location.href = mailto; }, 300);
    }
  }catch(err){
    alert('Erreur lors de la génération du fichier : '+(err && err.message ? err.message : err));
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=originalLabel||"📤 Envoyer ma feuille"; }
  }
}

/* ---------- code d'accès partagé (couche supplémentaire, pas une vraie sécurité) ---------- */
// Hash SHA-256 du code (pas le code en clair) — à remplacer si le code change.
const GATE_CODE_HASH = '09e5e98efcf3ead8c8b753703dc576ee78f9db7825683fdb15e35071c23bf00a';

async function hashText(text){
  const enc = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function initGate(){
  const alreadyOk = await kvGet('gate_ok');
  if(alreadyOk){
    document.getElementById('gateScreen').style.display='none';
    await continueInitAfterGate();
    return;
  }
  document.getElementById('gateScreen').style.display='flex';
  const input = document.getElementById('gateInput');
  const btn = document.getElementById('gateBtn');
  const err = document.getElementById('gateError');
  const tryValidate = async ()=>{
    const hash = await hashText(input.value.trim().toLowerCase());
    if(hash === GATE_CODE_HASH){
      err.style.display='none';
      await kvSet('gate_ok', true);
      document.getElementById('gateScreen').style.display='none';
      await continueInitAfterGate();
    } else {
      err.style.display='block';
      input.value='';
      input.focus();
    }
  };
  btn.onclick = tryValidate;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryValidate(); });
  input.focus();
}

async function continueInitAfterGate(){
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('tech');
  if(raw){
    const match = TECH_SLUGS[slugify(raw)];
    if(match){
      lockedByUrl = true;
      await selectTech(match);
      return;
    }
  }
  // Pas de lien personnel valide : comportement habituel (écran de sélection),
  // qu'il faut ici explicitement rendre visible (masqué pendant l'écran du code d'accès).
  document.getElementById('pickScreen').style.display='flex';
}
