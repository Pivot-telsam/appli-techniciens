<pre id="verdictTest" style="position:fixed;top:0;left:0;background:#fff;color:#000;z-index:99999;font:11px monospace;padding:4px;">en cours</pre>
<script>
/* TEST DU PLANNING RECU DE TEAMS ET DES CASES QUI RESTENT COCHEES.
 * A concatener apres index.html, Chrome --headless --dump-dom.
 *
 * DEUX DEFAUTS SIGNALES PAR PATRICE LE 03/09/2026 :
 *   1. « ils n'ont pas le planning » - le bandeau annoncait des semaines que
 *      l'appli n'avait pas ;
 *   2. « le pylone coche ne reste pas coche » - une autre equipe croyait que
 *      rien n'avait ete fait.
 * Chaque controle a son contre-exemple : sans eux, un test qui passe ne
 * prouverait que l'absence de plantage. */
(async function () {
  const R = []; let ko = 0;
  try {
  function ok(nom, cond, detail) {
    R.push((cond ? 'OK   ' : 'ECHEC') + ' | ' + nom + (detail ? '  -> ' + detail : ''));
    if (!cond) ko++;
  }
  function fin() {
    R.push('---');
    R.push(R.filter(l => l.startsWith('OK')).length + ' controle(s) passes, ' + ko + ' en echec');
    R.push(ko ? 'VERDICT: ECHEC' : 'VERDICT: TOUT PASSE');
    document.getElementById('verdictTest').textContent = R.join('\n');
  }
  for (let i = 0; i < 100 && typeof datesPour === 'undefined'; i++) await new Promise(r => setTimeout(r, 50));
  if (typeof datesPour === 'undefined') { document.getElementById('verdictTest').textContent = 'page non construite'; return; }
  // IndexedDB ne tourne pas sous --virtual-time-budget : on remplit 
  // depuis SEED_DATA, ce qui est l'etat d'un premier chargement.
  chantiers = {}; for (const f of SEED_DATA) chantiers[f.id] = f;

  // =======================================================================
  // 1. LE PLANNING EST BIEN ARRIVE
  // =======================================================================
  ok('1. le bloc planning est actif', planningTechActif(),
     PLANNING_TECH.du + ' -> ' + PLANNING_TECH.au + ', maj ' + PLANNING_TECH.maj);
  let couples = 0;
  for (const cid in PLANNING_TECH.tech) {
    for (const t in PLANNING_TECH.tech[cid]) couples += PLANNING_TECH.tech[cid][t].length;
  }
  R.push('     ' + couples + ' jour(s)-personne publies, sur ' + Object.keys(PLANNING_TECH.tech).length + ' chantier(s)');
  /* PAS DE SEUIL CHIFFRE ICI, ET C'EST VOULU.
   * Ce controle exigeait « plus de 100 jours-personne ». Le 10/09/2026 il en
   * a trouve 98 et il est passe au rouge alors que RIEN n'etait casse : c'est
   * la charge du planning qui varie d'une semaine sur l'autre, et l'appli n'y
   * peut rien. Exactement la meme faute que le controle de la semaine +2,
   * corrige la veille pour la meme raison : un seuil fige sur une donnee du
   * bureau finit par crier au loup, et un banc bruyant est abandonne — il
   * emporte alors les 35 autres controles avec lui.
   * Ce que le CODE garantit, et qui est verifie ici : le bloc n'est pas vide,
   * et aucune entree publiee n'est creuse — un chantier sans personne ou une
   * personne sans jour veut dire une publication a moitie ratee, et CA, c'est
   * un vrai defaut. Le chiffre reste IMPRIME juste au-dessus, pour l'oeil. */
  ok('1. le planning publie n\'est pas vide', couples > 0, String(couples));
  const creuses = [];
  for (const cid in PLANNING_TECH.tech) {
    const parTech = PLANNING_TECH.tech[cid];
    if (!Object.keys(parTech).length) creuses.push(cid);
    for (const t in parTech) if (!parTech[t].length) creuses.push(cid + ' / ' + t);
  }
  ok('1. aucune entree creuse dans le bloc publie', creuses.length === 0,
     creuses.slice(0, 5).join(' ; ') || 'aucune');

  // Combien de personnes voient quelque chose, semaine par semaine ?
  function personnesDeLaSemaine(offset) {
    const { mon, sun } = weekRange(offset);
    const vus = new Set();
    for (const cid of idsChantiersPlanifies()) {
      for (const tech of TECHS) {
        if (isoDatesInRange(datesPour(cid, tech), mon, sun).length) vus.add(tech);
      }
    }
    return vus;
  }
  const parSem = [];
  for (let o = 0; o <= 3; o++) parSem.push(personnesDeLaSemaine(o).size);
  R.push('     personnes servies : semaine en cours ' + parSem[0] + ', +1 ' + parSem[1]
         + ', +2 ' + parSem[2] + ', +3 ' + parSem[3]);
  ok('1. la semaine en cours sert toujours du monde', parSem[0] >= 8, String(parSem[0]));
  // LE DEFAUT SIGNALE : c'est la semaine PROCHAINE qui etait vide (1 personne).
  ok('1. la semaine prochaine ne sert plus 1 seule personne', parSem[1] >= 6, String(parSem[1]));
  /* CE CONTROLE A ETE RETOUCHE LE 09/09/2026, ET IL FAUT SAVOIR POURQUOI.
   * Il exigeait « au moins 6 personnes servies a +2 semaines », et il
   * echouait — non pas a cause d'un defaut de l'appli, mais parce que le
   * planning Teams n'est PAS REMPLI au-dela de la semaine 38 (mesure du
   * 09/09 : 3 cellules nommees apres le 18/09, toutes d'encadrement).
   *
   * Un controle ne doit porter que sur ce que le CODE garantit. Celui-la
   * demandait au bureau d'avoir pose son planning : l'appli n'y peut rien,
   * donc il criait au loup a chaque passage — et un controle bruyant est
   * abandonne en trois jours, ce qui detruit aussi les 30 autres.
   *
   * Ce qui reste garanti, et qui est verifie : l'appli sert TOUTES les
   * semaines que son planning contient. Si une semaine a des dates dans
   * PLANNING_TECH et n'affiche personne, c'est un vrai defaut. Le nombre
   * brut, lui, reste IMPRIME a chaque passage, pour qu'on continue a voir
   * l'etat du planning sans qu'il fasse echouer la suite. */
  const semainesDuPlanning = new Set();
  for (const cid in PLANNING_TECH.tech) {
    for (const t in PLANNING_TECH.tech[cid]) {
      for (const iso of PLANNING_TECH.tech[cid][t]) {
        const i = isoWeekInfo(new Date(iso + 'T00:00:00Z'));
        semainesDuPlanning.add(i.year + '-S' + i.week);
      }
    }
  }
  R.push('     semaines presentes dans le planning : ' + Array.from(semainesDuPlanning).sort().join(', '));
  const semainesVides = [];
  for (let o = -2; o <= 8; o++) {
    const w = weekRange(o);
    const cle = w.year + '-S' + w.weekNum;
    if (semainesDuPlanning.has(cle) && personnesDeLaSemaine(o).size === 0) semainesVides.push(cle);
  }
  ok('1. aucune semaine du planning ne sort vide', semainesVides.length === 0,
     semainesVides.join(', ') || 'aucune');

  // Les cas repares a la main doivent etre la
  function chantierDe(tech, iso) {
    const noms = [];
    for (const cid of idsChantiersPlanifies()) {
      if (datesPour(cid, tech).indexOf(iso) !== -1) {
        const c = chantierById(cid);
        noms.push(c ? (c.numero || c.nom) : cid);
      }
    }
    return noms;
  }
  /* CE QUI EST VERIFIE : TOUT CE QUE LE PLANNING PLACE EST MONTRABLE.
   *
   * Ces deux lignes exigeaient auparavant que Didier PERRIN soit sur Cantegrit
   * le 14/09 et Bilal HAMOUCH sur Bissy le 07/09 — deux affectations vraies le
   * jour ou le banc a ete ecrit, et rattachees par le repli sur `TECH_RANGES`
   * parce que leurs lignes de planning ne portaient pas de numero.
   * Le 10/09/2026 le premier est passe au rouge : le bureau avait reecrit le
   * planning, Didier n'est plus sur Cantegrit ce jour-la. **Rien n'etait casse
   * dans l'appli**, et le banc accusait pourtant. Un couple personne/jour/
   * chantier est de la donnee du bureau : il n'a rien a faire dans un test.
   *
   * La PROPRIETE que ces deux lignes protegeaient, elle, ne depend pas du
   * planning du jour : tout chantier que le planning place doit avoir une
   * fiche dans l'appli, sinon le technicien ouvre sa semaine et ne voit
   * RIEN ce jour-la. C'est ce qu'on mesure maintenant, sur tout le bloc
   * publie. Le contre-exemple est deux lignes plus bas : un identifiant
   * inconnu doit bien etre attrape. */
  const sansFiche = [];
  for (const cid in PLANNING_TECH.tech) {
    if (!chantierById(cid)) sansFiche.push(cid);
  }
  ok('1. chaque chantier place par le planning a bien une fiche dans l\'appli',
     sansFiche.length === 0, sansFiche.join(', ') || Object.keys(PLANNING_TECH.tech).length + ' chantier(s), tous rattaches');
  ok('1. CONTRE-EXEMPLE : un identifiant inconnu serait bien signale',
     !chantierById('c_chantier_qui_n_existe_pas'));

  // UNE SEULE SOURCE PAR JOUR : personne sur deux chantiers le meme jour
  const doubles = [];
  for (let o = 0; o <= 6; o++) {
    const { mon, sun } = weekRange(o);
    for (let d = new Date(mon); d <= sun; d.setUTCDate(d.getUTCDate() + 1)) {
      const iso = d.toISOString().slice(0, 10);
      for (const tech of TECHS) {
        const n = chantierDe(tech, iso);
        if (n.length > 1) doubles.push(iso + ' ' + tech + ' : ' + n.join(' ET '));
      }
    }
  }
  ok('1. personne sur DEUX chantiers le meme jour', doubles.length === 0,
     doubles.length ? doubles.slice(0, 3).join(' | ') : 'aucun');

  /* Contre-exemple : si le bloc planning est neutralise, l'appli doit le
   * SAVOIR et retomber sur les dates saisies a la main.
   *
   * RETOUCHE LE 09/09/2026 : ce controle exigeait « au moins 8 personnes »
   * depuis ce repli. Il en trouve 3, et c'est normal — la recopie manuelle
   * a ete ABANDONNEE le 01/09/2026 (« c'est le PLANNING qui dit vrai »), donc
   * exiger 8 personnes de ce cote, c'est exiger le retour d'un mecanisme
   * retire expres. On verifie ce qui reste vrai : la bascule se declenche.
   *
   * MAIS ON IMPRIME LA TAILLE DU FILET, parce qu'elle a un sens : c'est ce
   * que verrait un technicien si le planning ne se chargeait pas. A 3
   * personnes sur 13, ce n'est plus un filet. A dire a Patrice, pas a
   * corriger ici. */
  const vraiDu = PLANNING_TECH.du;
  PLANNING_TECH.du = '';
  const filet = personnesDeLaSemaine(0).size;
  ok('1. bloc neutralise : l appli le detecte et bascule', !planningTechActif(),
     'repli : ' + filet + ' personne(s) servie(s) par les dates saisies a la main');
  PLANNING_TECH.du = vraiDu;
  ok('1. et la bascule est bien reversible', planningTechActif());

  // =======================================================================
  // 2. LES CASES QUI RESTENT COCHEES
  // =======================================================================
  /* REECRIT LE 24/09/2026 : LE CAS EST FABRIQUE, IL N'EST PLUS CHERCHE.
   * Cette serie prenait le premier chantier declare qui avait des taches
   * vendues, et exigeait d'y trouver des PYLONES coches. Le 24/09 ce premier
   * chantier etait 26-115, dont la seule declaration est un ETAT (touret « en
   * cours ») : 0 case, 5 echecs, et rien de casse dans l'appli. C'est l'etat du
   * monde fige que le §17 interdit. On prend donc une fiche qui a une tache a
   * reperes, on y POSE une declaration connue (partagee et locale), on mesure,
   * puis on RESTAURE AVANCEMENT_DECLARE et kvGet. Le cas « etat sans reperes »,
   * celui qui avait fait tomber l'ancienne serie, est eprouve a part. */
  const declAvant = JSON.stringify(AVANCEMENT_DECLARE);
  const vraiKvGet = kvGet, vraiKvSet = kvSet, vraiTech = currentTech;
  let locale = {};                       // la memoire du telephone, doublee
  kvGet = async (k) => locale[k];
  kvSet = async (k, v) => { locale[k] = v; return true; };
  try {
    /* 2.0 LA FORME DE CE QUI EST PUBLIE : propriete sur toute la donnee du
     * jour (le nombre de chantiers declares, lui, n'est qu'imprime). */
    const numDecl = Object.keys(AVANCEMENT_DECLARE.chantiers || {});
    R.push('     avancement declare : ' + numDecl.length + ' chantier(s), maj ' + AVANCEMENT_DECLARE.maj);
    function declMalFormees(chs) {
      const mal = [];
      for (const n in chs) for (const tid in chs[n]) {
        const d = chs[n][tid] || {};
        const okP = Array.isArray(d.pylones) && d.pylones.every(p => p && p.p !== undefined && p.p !== '');
        if (!okP && !d.statut) mal.push(n + '/' + tid);
      }
      return mal;
    }
    const mal = declMalFormees(AVANCEMENT_DECLARE.chantiers || {});
    ok('2. chaque declaration publiee porte des reperes ou un etat', mal.length === 0, mal.join(', ') || 'toutes');
    ok('2. CONTRE-EXEMPLE : une declaration creuse serait attrapee',
       declMalFormees({ 'x': { t: {} }, 'y': { t: { pylones: [{ p: '' }] } } }).length === 2);

    // Les deux fiches du cas : une tache a reperes (3 au moins), une tache sans.
    const tachePyl = c => (c.tachesVendues && c.tachesVendues.taches || [])
      .map((t, i) => ({ t: t, tid: t.id || ('t' + i) })).find(x => x.t.pylones && x.t.pylones.length >= 3);
    const tacheEtat = c => (c.tachesVendues && c.tachesVendues.taches || [])
      .map((t, i) => ({ t: t, tid: t.id || ('t' + i) })).find(x => !(x.t.pylones && x.t.pylones.length));
    const cP = SEED_DATA.find(c => c.numero && tachePyl(c));
    const cS = SEED_DATA.find(c => c.numero && tacheEtat(c));
    ok('2. une fiche a reperes existe pour fabriquer le cas', !!cP, cP ? cP.numero : 'aucune');
    ok('2. une fiche a etat existe pour fabriquer le cas', !!cS, cS ? cS.numero : 'aucune');

    const moi = TECHS[0], autre = TECHS[1];
    currentTech = moi;

    if (cP) {
      const { tid } = tachePyl(cP);
      const rep = tachePyl(cP).t.pylones.map(String);
      const cle = 'suivi_' + cP.numero;
      const compte = async () => {
        await ouvrirSuivi(cP.id);
        const ov = document.getElementById('suiviOverlay');
        const grille = ov && ov.querySelector('.pyl-grid[data-tache="' + tid + '"]');
        const r = {
          ov: !!ov,
          on: grille ? [].slice.call(grille.querySelectorAll('.pyl-chip.on')).map(x => x.dataset.pyl) : null,
          autre: grille ? [].slice.call(grille.querySelectorAll('.pyl-chip.on.autre')).map(x => x.dataset.pyl) : null,
          titres: grille ? [].slice.call(grille.querySelectorAll('.pyl-chip.on')).map(x => x.getAttribute('title') || '') : [],
          total: grille ? grille.querySelectorAll('.pyl-chip').length : 0,
          deja: ov && ov.querySelector('.suivi-deja') ? ov.querySelector('.suivi-deja').textContent : ''
        };
        fermerSuivi();
        return r;
      };

      // SCENE A : un collegue a declare les deux premiers reperes, rien en local.
      AVANCEMENT_DECLARE.chantiers[cP.numero] = { [tid]: { pylones: [
        { p: rep[0], par: autre, le: '01/09/26' }, { p: rep[1], par: autre, le: '02/09/26' } ] } };
      locale = {};
      const memo = await memoireSuivi(cP);
      const vus = Object.keys((memo[tid] || {}).pylones || {});
      ok('2. la memoire retrouve les reperes declares par un collegue',
         vus.length === 2 && vus.indexOf(rep[0]) !== -1 && vus.indexOf(rep[1]) !== -1,
         cP.numero + ' : ' + vus.join(', '));
      let a = await compte();
      ok('2. la fenetre de suivi s ouvre', a.ov && a.on !== null);
      ok('2. ces deux cases sont cochees a l ouverture, et elles seules',
         a.on && a.on.length === 2 && a.on.indexOf(rep[0]) !== -1 && a.on.indexOf(rep[1]) !== -1,
         (a.on || []).join(', ') + ' / ' + a.total);
      ok('2. elles sont marquees comme venant d un autre', a.autre && a.autre.length === 2, String(a.autre));
      ok('2. et l infobulle dit par qui', a.titres.length === 2 && a.titres.every(t => t.indexOf(autre) !== -1),
         a.titres[0] || 'aucune');
      ok('2. un rappel compte les cases deja declarees', /\b2\b/.test(a.deja), a.deja.trim().slice(0, 60));
      ok('2. et TOUTES les cases ne sont pas cochees', a.total > 2, 2 + ' / ' + a.total);

      // SCENE B : j'ai coche un troisieme repere depuis ce telephone.
      locale[cle] = { faits: { [tid]: [rep[2]] }, le: '03/09/2026' };
      let b = await compte();
      ok('2. ma propre coche locale s ajoute (union), sans la marque « autre »',
         b.on && b.on.length === 3 && b.on.indexOf(rep[2]) !== -1 && b.autre.indexOf(rep[2]) === -1,
         (b.on || []).join(', ') + ' | autre : ' + (b.autre || []).join(', '));

      // SCENE C : j'ai DECOCHE le premier apres la consolidation -> masque.
      locale[cle] = { faits: {}, retires: { [tid]: { [rep[0]]: '2999-01-01 00:00' } } };
      let m1 = await compte();
      ok('2. un repere que j ai decoche apres la consolidation reste decoche',
         m1.on && m1.on.indexOf(rep[0]) === -1 && m1.on.indexOf(rep[1]) !== -1, (m1.on || []).join(', '));
      locale[cle] = { faits: {}, retires: { [tid]: { [rep[0]]: '2000-01-01 00:00' } } };
      let m2 = await compte();
      ok('2. CONTRE-EXEMPLE : decoche AVANT la consolidation, le partage refait foi',
         m2.on && m2.on.indexOf(rep[0]) !== -1, (m2.on || []).join(', '));

      // CONTRE-EXEMPLE ENTIER : la meme fiche, sans aucune declaration nulle part.
      delete AVANCEMENT_DECLARE.chantiers[cP.numero];
      locale = {};
      let v = await compte();
      ok('2. CONTRE-EXEMPLE : la meme fiche sans declaration ouvre tout decoche',
         v.on && v.on.length === 0 && v.deja === '', (v.on || []).length + ' / ' + v.total);
    } else {
      ok('2. serie des reperes jouee', false, 'aucune fiche a 3 reperes ou plus : 9 controles non joues');
    }

    if (cS) {
      const { tid } = tacheEtat(cS);
      const etat = async () => {
        await ouvrirSuivi(cS.id);
        const ov = document.getElementById('suiviOverlay');
        const b = ov && ov.querySelector('.suivi-field[data-tache="' + tid + '"] .statut-chip');
        const r = b ? { etat: b.dataset.etat, titre: b.getAttribute('title') || '' } : null;
        fermerSuivi();
        return r;
      };
      AVANCEMENT_DECLARE.chantiers[cS.numero] = { [tid]: { statut: 'fait', par: autre, le: '04/09/26' } };
      locale = {};
      const e1 = await etat();
      ok('2. une tache sans repere declaree « fait » s ouvre sur « Fait », signee',
         !!e1 && e1.etat === '2' && e1.titre.indexOf(autre) !== -1,
         cS.numero + ' : ' + JSON.stringify(e1));
      delete AVANCEMENT_DECLARE.chantiers[cS.numero];
      const e0 = await etat();
      ok('2. CONTRE-EXEMPLE : sans declaration elle s ouvre sur « Pas fait »',
         !!e0 && e0.etat === '0' && e0.titre === '', JSON.stringify(e0));
    } else {
      ok('2. serie des etats jouee', false, 'aucune fiche a tache sans repere : 2 controles non joues');
    }

    // La memoire locale : union, jamais remplacement
    locale = {};
    const faux = { id: 'c_faux', numero: '99-999' };
    await retenirSuivi(faux, { racc: ['1', '2'] });
    await retenirSuivi(faux, { racc: ['2', '3'], doo: 'fait' });
    const garde = locale['suivi_99-999'] || { faits: {} };
    ok('2. la memoire locale fait l UNION des envois',
       JSON.stringify(garde.faits.racc) === '["1","2","3"]', JSON.stringify(garde.faits));
    ok('2. et garde le statut des taches sans pylone', garde.faits.doo === 'fait');
  } finally {
    const reste = JSON.parse(declAvant);
    AVANCEMENT_DECLARE.chantiers = reste.chantiers;
    kvGet = vraiKvGet; kvSet = vraiKvSet; currentTech = vraiTech;
    fermerSuivi();
  }
  ok('2. AVANCEMENT_DECLARE est restaure apres la serie', JSON.stringify(AVANCEMENT_DECLARE) === declAvant);
  ok('2. et la memoire du telephone aussi', kvGet === vraiKvGet && kvSet === vraiKvSet);

  // =======================================================================
  // 3. AVEC QUI JE SUIS (demande des techniciens, 03/09/2026)
  // =======================================================================
  /* REECRIT LE 24/09/2026. La serie cherchait un chantier REEL a plusieurs
   * personnes la semaine prochaine, prenait la premiere comme « moi », puis
   * ajoutait « Hugues VIRY » deux jours pour eprouver les jours differents.
   * Ce jour-la, « moi » ETAIT Hugues VIRY : la personne ajoutee etait moi, donc
   * exclue du bloc, et 2 controles tombaient sans aucun defaut. Un nom ecrit en
   * dur dans une scene tiree de la donnee du jour finit toujours par tomber sur
   * elle. La scene est maintenant ENTIEREMENT fabriquee sur une vraie fiche, avec
   * quatre personnes tirees de TECHS et distinctes par construction, puis la
   * donnee est restauree. La donnee du jour garde une propriete, mesuree sur
   * TOUT le planning de la semaine prochaine (et le nombre de cas imprime). */
  const sem = weekRange(1);
  const isoS = d => d.toISOString().slice(0, 10);
  const jourDe = n => isoS(new Date(sem.mon.getTime() + n * 86400000));

  // 3.0 La propriete sur la donnee du jour : chacun lit exactement les autres.
  let casReels = 0; const fautes = [];
  for (const cid of idsChantiersPlanifies()) {
    const tous = Object.keys(Object.assign({}, planningTechActif() ? PLANNING_TECH.tech[cid] : {}, TECH_RANGES[cid] || {}));
    const presents = tous.filter(t => isoDatesInRange(datesPour(cid, t), sem.mon, sem.sun).length);
    for (const t of presents) {
      casReels++;
      const eq = equipeSurChantier(cid, sem.mon, sem.sun, t).map(p => p.nom).sort();
      const attendu = presents.filter(x => x !== t).sort();
      if (JSON.stringify(eq) !== JSON.stringify(attendu)) fautes.push(cid + ' / ' + t);
    }
  }
  R.push("     semaine prochaine : " + casReels + ' couple(s) personne/chantier dans la donnee du jour');
  ok('3. dans la donnee du jour, chacun voit exactement les autres presents', fautes.length === 0,
     fautes.slice(0, 3).join(' ; ') || 'aucune faute');

  const cid3 = (SEED_DATA.find(c => c.numero) || {}).id;
  const garde3 = { tech: PLANNING_TECH.tech[cid3], ranges: TECH_RANGES[cid3],
                   du: PLANNING_TECH.du, au: PLANNING_TECH.au, moi: currentTech };
  const avant3 = JSON.stringify({ t: garde3.tech, r: garde3.ranges, du: garde3.du, au: garde3.au });
  try {
    ok('3. une fiche pour poser la scene', !!cid3, (chantierById(cid3) || {}).numero);
    if (!cid3) throw new Error('aucune fiche');
    // La fenetre publiee doit couvrir la semaine de la scene (sinon datesPour
    // ignore les dates posees) : on l'elargit le temps de la scene.
    if (!(PLANNING_TECH.du && PLANNING_TECH.du <= jourDe(-7))) PLANNING_TECH.du = jourDe(-7);
    if (!(PLANNING_TECH.au && PLANNING_TECH.au >= jourDe(6))) PLANNING_TECH.au = jourDe(6);
    const [moi, meme, deux, ailleurs] = TECHS.slice(0, 4);
    const semaine = [0, 1, 2, 3, 4].map(jourDe);
    // « deux » est pose AVANT « meme » dans l'objet : l'ordre affiche ne doit
    // pas etre l'ordre d'insertion mais l'ordre d'arrivee.
    PLANNING_TECH.tech[cid3] = {
      [moi]: semaine.slice(), [deux]: [jourDe(2), jourDe(3)], [meme]: semaine.slice(),
      [ailleurs]: [jourDe(-7)]
    };
    TECH_RANGES[cid3] = {};
    currentTech = moi;
    const mesJours = isoDatesInRange(datesPour(cid3, moi), sem.mon, sem.sun);
    ok('3. la scene me place bien 5 jours', mesJours.length === 5, mesJours.join(' '));

    const eq = equipeSurChantier(cid3, sem.mon, sem.sun, moi);
    const noms = eq.map(p => p.nom);
    ok('3. l equipe liste les deux collegues, sans moi',
       noms.length === 2 && noms.indexOf(meme) !== -1 && noms.indexOf(deux) !== -1 && noms.indexOf(moi) === -1,
       noms.join(', '));
    ok('3. CONTRE-EXEMPLE : celui qui vient une autre semaine n y est pas', noms.indexOf(ailleurs) === -1);
    ok('3. chacun a SES jours', eq.every(p => p.jours.length === (p.nom === deux ? 2 : 5)),
       eq.map(p => p.nom + ' ' + p.jours.length + 'j').join(' | '));
    ok('3. ils sont classes du plus tot arrive au plus tard, pas dans l ordre de saisie',
       noms[0] === meme && noms[1] === deux, noms.join(' puis '));

    const html = blocEquipe(cid3, sem.mon, sem.sun, mesJours);
    const ligne = n => html.split('<div class="equipe-l">').find(x => x.indexOf(n) !== -1) || '';
    const lisible = s => s.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    ok('3. le bloc nomme les collegues', html.indexOf(meme) !== -1 && html.indexOf(deux) !== -1);
    ok('3. le bloc annonce le nombre', html.indexOf('(2)') !== -1, lisible(html).slice(0, 60));
    ok('3. celui qui a exactement mes jours lit « memes jours que toi »',
       /mêmes jours que toi/.test(ligne(meme)), lisible(ligne(meme)));
    ok('3. CONTRE-EXEMPLE : dans la MEME scene, celui present 2 jours voit SES jours',
       ligne(deux) !== '' && !/mêmes jours/.test(ligne(deux))
         && /\bMer\b/.test(ligne(deux)) && /\bJeu\b/.test(ligne(deux)) && !/\bLun\b/.test(ligne(deux)),
       lisible(ligne(deux)));
    ok('3. la carte du chantier contient le bloc',
       renderCard(chantierById(cid3), mesJours, sem.mon, sem.sun).indexOf('class="equipe"') !== -1);
    ok('3. CONTRE-EXEMPLE : sans semaine, la carte n a pas de bloc',
       renderCard(chantierById(cid3), mesJours).indexOf('class="equipe"') === -1);
    ok('3. CONTRE-EXEMPLE : avec des collegues, personne ne lit « tu es seul »', !/Tu es seul/.test(html));

    // Seul : la meme fiche, moi seul.
    PLANNING_TECH.tech[cid3] = { [moi]: semaine.slice(), [ailleurs]: PLANNING_TECH.tech[cid3][ailleurs] };
    const hs = blocEquipe(cid3, sem.mon, sem.sun, mesJours);
    ok('3. celui qui est seul lit « tu es seul »', /Tu es seul/.test(hs), lisible(hs).slice(0, 60));
    ok('3. et aucun nom de collegue ne s y glisse', !TECHS.some(t => t !== moi && hs.indexOf(t) !== -1));
  } catch (e) {
    ok('3. la scene s est jouee jusqu au bout', false, e && e.message ? e.message : String(e));
  } finally {
    if (garde3.tech === undefined) delete PLANNING_TECH.tech[cid3]; else PLANNING_TECH.tech[cid3] = garde3.tech;
    if (garde3.ranges === undefined) delete TECH_RANGES[cid3]; else TECH_RANGES[cid3] = garde3.ranges;
    PLANNING_TECH.du = garde3.du; PLANNING_TECH.au = garde3.au; currentTech = garde3.moi;
  }
  ok('3. la donnee reelle est restauree apres la scene',
     JSON.stringify({ t: PLANNING_TECH.tech[cid3], r: TECH_RANGES[cid3], du: PLANNING_TECH.du, au: PLANNING_TECH.au }) === avant3);

  fin();
  } catch (e) {
    // Un test qui meurt en silence ne vaut rien : on affiche l'erreur ET la pile.
    const lignes = R.slice();
    lignes.push('');
    lignes.push('VERDICT: ERREUR ' + (e && e.message ? e.message : e));
    if (e && e.stack) lignes.push(String(e.stack).split('\n').slice(0, 4).join(' | '));
    document.getElementById('verdictTest').textContent = lignes.join('\n');
  }
})();
</script>
