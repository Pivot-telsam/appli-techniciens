<pre id="verdictTest" style="position:fixed;top:0;left:0;background:#fff;color:#000;z-index:99999;font:11px monospace;padding:4px;">en cours</pre>
<script>
/* TEST DE LA REPOSE DES SEMAINES PASSEES (demande de Patrice le 09/09/2026).
 * A concatener apres index.html, Chrome --headless --dump-dom.
 *
 * SA DEMANDE : « ceux qui sont deja remplis depuis la S34, remplis-les toi
 * aussi et remets-les dans l'appli ».
 *
 * CE QUI EST DANGEREUX ICI N'EST PAS DE POSER, C'EST D'ECRASER. La saisie vit
 * dans le telephone du technicien et nulle part ailleurs : une pose qui passe
 * par-dessus une semaine deja remplie DETRUIT une donnee que personne ne peut
 * restaurer. Trois proprietes valent donc plus que le reste, et chacune a son
 * contre-exemple - un test qui ne peut pas echouer ne prouve rien :
 *   - controle 4 : une semaine deja saisie n'est PAS remplacee ;
 *   - controle 5 : une semaine effacee par le technicien ne REVIENT PAS ;
 *   - controle 6 : ce qui est pose ressort a l'identique dans la feuille
 *     officielle - c'est la seule preuve que l'appli sait relire ce format.
 */
(async function () {
  const R = []; let ko = 0;
  function ok(nom, cond, detail) {
    R.push((cond ? 'OK   ' : 'ECHEC') + ' | ' + nom + (detail ? '  -> ' + detail : ''));
    if (!cond) ko++;
  }
  function fin() {
    R.push('---');
    R.push(R.filter(l => l.startsWith('OK')).length + ' controle(s) passes, ' + ko + ' en echec');
    R.push(ko ? 'VERDICT: ECHEC' : 'VERDICT: TOUT PASSE');
    document.getElementById('verdictTest').textContent = R.join('\n');
  }
  try {
    for (let i = 0; i < 100 && typeof SEED_FEUILLES === 'undefined'; i++) await new Promise(r => setTimeout(r, 50));
    if (typeof SEED_FEUILLES === 'undefined') { document.getElementById('verdictTest').textContent = 'page non construite'; return; }

    /* MAGASIN EN MEMOIRE. IndexedDB n'est pas fiable sur une origine
       `file://` : on remplace les deux seuls acces au magasin, et on compte
       les ecritures - c'est le compteur qui prouve l'absence de repose. */
    const magasin = new Map();
    let nbEcritures = 0;
    kvGet = async (k) => (magasin.has(k) ? JSON.parse(JSON.stringify(magasin.get(k))) : null);
    kvSet = async (k, v) => { nbEcritures++; magasin.set(k, JSON.parse(JSON.stringify(v))); return true; };

    // ---- 1. le jeu de feuilles couvre tout le monde, une fois chacun ----
    /* CES TROIS CONTROLES ONT ETE DEGELES LE 15/09/2026, ET LE GEL AVAIT UN COUT.
       Ils disaient « 39 feuilles », « S34 a S36 » et « aucune S37+ » : des
       chiffres du 09/09 ecrits en dur. La S37 ajoutee au tableau, le banc est
       passe au rouge sur trois lignes alors que RIEN n'etait casse - et un banc
       rouge en permanence n'est plus lu, il emporte avec lui les controles justes
       qui l'entourent. Ils mesurent maintenant une PROPRIETE : le tableau couvre
       tout le monde pour toutes les semaines qu'il contient, et il ne contient
       que du passe. Voir CLAUDE.md §16, « ne pas figer un etat du monde ». */
    /* LES SEMAINES REPRISES DES ENVOIS (S39 et suivantes, 06/10/2026) NE
       COMPTENT QUE LES FEUILLES REÇUES : on n'invente pas celle qui n'est pas
       arrivée, et une feuille qui porte un arrêt maladie reste hors de ce
       fichier public. La règle « tout le monde, chaque semaine » ne vaut que
       pour les semaines recopiées du classeur (S34 à S38). */
    const envoi = s => s.source === 'envoi';
    const semaines = [...new Set(SEED_FEUILLES.filter(s => !envoi(s)).map(s => s.semaine))].sort((a, b) => a - b);
    const classeur = SEED_FEUILLES.filter(s => !envoi(s));
    ok('1. ' + (TECHS.length * semaines.length) + ' feuilles (' + TECHS.length + ' techniciens x '
         + semaines.length + ' semaines : S' + semaines.join(', S') + ')',
       classeur.length === TECHS.length * semaines.length,
       classeur.length + ' feuilles');
    const envois = SEED_FEUILLES.filter(envoi);
    ok('1. les feuilles reprises des envois portent la saisie partie (technicien et semaine concordent)',
       envois.length > 0 && envois.every(s => s.envoi && s.envoi.technicien === s.tech && Number(s.envoi.weekNum) === s.semaine),
       envois.length + ' feuille(s) : S' + [...new Set(envois.map(s => s.semaine))].join(', S'));
    ok('1. aucune absence de santé dans ce fichier public',
       SEED_FEUILLES.every(s => (s.feuille.absences || []).every(a => a.key !== 'maladie' && a.key !== 'accident')));
    const inconnus = SEED_FEUILLES.filter(s => TECHS.indexOf(s.tech) === -1).map(s => s.tech);
    ok('1. tous les noms figurent dans TECHS', inconnus.length === 0, inconnus.join(', ') || 'aucun intrus');
    const vus = {};
    SEED_FEUILLES.forEach(s => { const c = s.tech + '|' + s.annee + '|' + s.semaine; vus[c] = (vus[c] || 0) + 1; });
    ok('1. aucun doublon technicien/semaine', Object.keys(vus).every(c => vus[c] === 1));
    const trous = [];
    TECHS.forEach(t => semaines.forEach(w => {
      if (!classeur.some(s => s.tech === t && s.semaine === w)) trous.push(t + ' S' + w);
    }));
    ok('1. chaque technicien a toutes les semaines du tableau', trous.length === 0,
       trous.join(', ') || 'aucun trou');
    /* Le tableau ne decrit que du passe deja transmis au bureau : une semaine en
       cours se remplit dans l'appli, pas ici. On le mesure contre la semaine du
       JOUR, pas contre un numero fige - sinon ce controle redevient faux au
       prochain lundi. */
    const auj = new Date();
    const jeu = new Date(Date.UTC(auj.getFullYear(), auj.getMonth(), auj.getDate()));
    jeu.setUTCDate(jeu.getUTCDate() + 3 - ((jeu.getUTCDay() + 6) % 7));
    const semCourante = Math.ceil(((jeu - Date.UTC(jeu.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
    const anCourant = jeu.getUTCFullYear();
    const pasPassees = SEED_FEUILLES
      .filter(s => s.annee > anCourant || (s.annee === anCourant && s.semaine >= semCourante))
      .map(s => s.tech + ' S' + s.semaine);
    ok('1. aucune semaine en cours ni a venir (nous sommes en S' + semCourante + ')',
       pasPassees.length === 0, pasPassees.join(', ') || 'toutes les semaines sont revolues');

    // ---- 2. les references pointent quelque part, et rien ne s'evapore ----
    const idsMorts = [];
    SEED_FEUILLES.forEach(s => s.feuille.chantierLines.forEach(l => {
      // `__contribution_agence__` n'est pas une fiche : c'est la ligne de l'appli pour la contribution agence.
      if (l.id && l.id !== '__contribution_agence__' && !chantierById(l.id)) idsMorts.push(s.tech + ' S' + s.semaine + ' : ' + l.id);
    }));
    ok('2. chaque ligne liee pointe une fiche existante', idsMorts.length === 0, idsMorts.join(' ; ') || 'aucun id mort');
    const clesInconnues = [];
    SEED_FEUILLES.forEach(s => (s.feuille.absences || []).forEach(a => {
      if (!ABSENCE_CODES.some(c => c.key === a.key)) clesInconnues.push(s.tech + ' S' + s.semaine + ' : ' + a.key);
    }));
    ok('2. chaque absence porte un code connu de l\'appli', clesInconnues.length === 0,
       clesInconnues.join(' ; ') || 'aucun code inconnu');
    /* `ensureFeuilleForWeek` RETIRE les absences « contribution » a chaque
       lecture (residu de l'ancien systeme). Une feuille posee qui en
       contiendrait perdrait ces heures en silence. */
    ok('2. aucune absence « contribution » (elle serait effacee a la lecture)',
       SEED_FEUILLES.every(s => (s.feuille.absences || []).every(a => a.key !== 'contribution')));

    // ---- 3. la pose ecrit sous les cles que l'appli va relire ----
    const tech = 'Anthony DENIS';
    await installerFeuillesPassees(tech);
    const sesSemaines = SEED_FEUILLES.filter(s => s.tech === tech).map(s => s.semaine);
    ok('3. ses ' + sesSemaines.length + ' semaines sont posees',
       sesSemaines.every(w => magasin.has('fh_' + tech + '_2026_' + w)),
       Array.from(magasin.keys()).filter(k => k.indexOf('fh_') === 0).join(', '));
    ok('3. rien n\'est pose pour les autres techniciens',
       !Array.from(magasin.keys()).some(k => k.indexOf('fh_') === 0 && k.indexOf(tech) === -1));
    /* LA CLE EST CELLE D'ensureFeuilleForWeek, ET ON LE VERIFIE PAR LE VRAI
       CHEMIN : on lui donne la semaine 34 et on regarde ce qu'elle charge. */
    currentTech = tech;
    const w34 = { year: 2026, weekNum: 34, mon: new Date(Date.UTC(2026, 7, 17)), sun: new Date(Date.UTC(2026, 7, 23)) };
    await ensureFeuilleForWeek(tech, w34);
    ok('3. l\'appli retrouve la feuille par son chemin normal',
       hoursEntry && hoursEntry.chantierLines.length === 1 && hoursEntry.chantierLines[0].nom === 'Portet',
       hoursEntry ? JSON.stringify(hoursEntry.chantierLines.map(l => l.nom)) : 'rien');
    ok('3. les heures relues sont celles de la feuille (7 h du lundi au vendredi)',
       [0, 1, 2, 3, 4].every(d => hoursEntry.chantierLines[0].jours[d] && hoursEntry.chantierLines[0].jours[d].j === 7));
    ok('3. la feuille se sait deja envoyee', !!hoursEntry.envoyeLe, hoursEntry.envoyeLe || 'aucune date');

    /* AUCUNE LIGNE EN DOUBLE, SUR LES 39. `ensureFeuilleForWeek` ajoute
       d'office les chantiers planifies de la semaine, et `TECH_RANGES`
       connait encore aout : la S34 d'Anthony sortait avec SA ligne
       « Portet » remplie ET une ligne « Poste de Portet (P.SIM) » vide.
       Deux lignes pour le meme chantier sur une feuille deja envoyee, c'est
       une invitation a saisir deux fois. On repasse donc chaque feuille par
       le vrai chemin de lecture. */
    const magasinD = new Map();
    kvGet = async (k) => (magasinD.has(k) ? JSON.parse(JSON.stringify(magasinD.get(k))) : null);
    kvSet = async (k, v) => { magasinD.set(k, JSON.parse(JSON.stringify(v))); return true; };
    let enDouble = 0, detailDouble = '';
    for (const t of TECHS) await installerFeuillesPassees(t);
    for (const s of SEED_FEUILLES) {
      currentTech = s.tech;
      const lundi = mondayOfISOWeek(s.semaine, s.annee);
      const dimanche = new Date(lundi); dimanche.setUTCDate(dimanche.getUTCDate() + 6);
      await ensureFeuilleForWeek(s.tech, { year: s.annee, weekNum: s.semaine, mon: lundi, sun: dimanche });
      const attendu = s.feuille.chantierLines.map(l => l.nom).join(' | ');
      const obtenu = hoursEntry.chantierLines.map(l => l.nom).join(' | ');
      if (attendu !== obtenu) {
        enDouble++;
        if (!detailDouble) detailDouble = s.tech + ' S' + s.semaine + ' : [' + attendu + '] devient [' + obtenu + ']';
      }
    }
    ok('3. aucune ligne ajoutee ni perdue a la relecture, sur toutes les feuilles',
       enDouble === 0, enDouble ? detailDouble : SEED_FEUILLES.length + ' feuilles relues a l\'identique');
    /* CONTRE-EXEMPLE : sans les `removedAutoIds` poses, la ligne automatique
       revient bien - la preuve que ce controle peut echouer. */
    const sansGarde = JSON.parse(JSON.stringify(
      SEED_FEUILLES.find(s => s.tech === 'Anthony DENIS' && s.semaine === 34).feuille));
    sansGarde.removedAutoIds = [];
    magasinD.set('fh_Anthony DENIS_2026_34', sansGarde);
    currentTech = 'Anthony DENIS';
    await ensureFeuilleForWeek('Anthony DENIS', w34);
    ok('3. CONTRE-EXEMPLE : sans le garde-fou, la ligne automatique revient bien',
       hoursEntry.chantierLines.length === 2,
       JSON.stringify(hoursEntry.chantierLines.map(l => l.nom)));

    // ---- 4. ON N'ECRASE JAMAIS UNE SAISIE ----
    const magasin2 = new Map(); nbEcritures = 0;
    const magasinCourant = () => magasin2;
    kvGet = async (k) => (magasin2.has(k) ? JSON.parse(JSON.stringify(magasin2.get(k))) : null);
    kvSet = async (k, v) => { nbEcritures++; magasin2.set(k, JSON.parse(JSON.stringify(v))); return true; };
    // une S35 deja saisie a la main sur le telephone, avec des heures differentes
    const sienne = { chantierLines: [{ id: null, nom: 'MA SAISIE', lieu: '', client: '', jours: { 0: { j: 3 } } }],
                     removedAutoIds: [], absences: [], pd: {}, gd: {}, nacelle: {},
                     vehiculeMode: null, km: '', immat: '', commentaires: '' };
    magasin2.set('fh_' + tech + '_2026_35', JSON.parse(JSON.stringify(sienne)));
    await installerFeuillesPassees(tech);
    const apres35 = magasin2.get('fh_' + tech + '_2026_35');
    ok('4. la semaine deja saisie est intacte', apres35.chantierLines[0].nom === 'MA SAISIE'
       && apres35.chantierLines[0].jours[0].j === 3, JSON.stringify(apres35.chantierLines.map(l => l.nom)));
    // CONTRE-EXEMPLE : les deux autres semaines, vides, ont bien ete posees
    ok('4. CONTRE-EXEMPLE : les semaines vides, elles, sont bien remplies',
       magasin2.get('fh_' + tech + '_2026_34').chantierLines.length === 1
       && magasin2.get('fh_' + tech + '_2026_36').chantierLines.length === 1);
    // CONTRE-EXEMPLE : une semaine ou il n'a note QUE ses kilometres est une saisie
    ok('4. CONTRE-EXEMPLE : une semaine avec seulement des km compte comme saisie',
       !feuilleVierge({ chantierLines: [], absences: [], pd: {}, gd: {}, nacelle: {}, km: '31699' }));
    ok('4. CONTRE-EXEMPLE : une semaine avec seulement une nacelle aussi',
       !feuilleVierge({ chantierLines: [], absences: [], pd: {}, gd: {}, nacelle: { 2: 1 } }));
    ok('4. CONTRE-EXEMPLE : une semaine avec seulement un commentaire aussi',
       !feuilleVierge({ chantierLines: [], absences: [], pd: {}, gd: {}, nacelle: {}, commentaires: 'RAS' }));
    ok('4. une semaine reellement vide est bien vue comme vierge',
       feuilleVierge({ chantierLines: [{ id: 'x', nom: 'auto', jours: {} }], absences: [], pd: {}, gd: {}, nacelle: {} }));

    // ---- 5. UNE SEMAINE EFFACEE NE REVIENT PAS ----
    const magasin3 = new Map(); nbEcritures = 0;
    kvGet = async (k) => (magasin3.has(k) ? JSON.parse(JSON.stringify(magasin3.get(k))) : null);
    kvSet = async (k, v) => { nbEcritures++; magasin3.set(k, JSON.parse(JSON.stringify(v))); return true; };
    await installerFeuillesPassees(tech);          // premiere pose
    const ecrituresPose = nbEcritures;
    const sesFeuilles = SEED_FEUILLES.filter(s => s.tech === tech).length;
    ok('5. la premiere pose ecrit (' + sesFeuilles + ' feuilles + le registre)',
       ecrituresPose === sesFeuilles + 1, ecrituresPose + ' ecriture(s)');
    // le technicien efface sa S34, comme le fait « Effacer et recommencer cette semaine »
    magasin3.set('fh_' + tech + '_2026_34', { chantierLines: [], removedAutoIds: [], absences: [], pd: {}, gd: {},
                                              nacelle: {}, vehiculeMode: null, km: '', immat: '', commentaires: '' });
    nbEcritures = 0;
    await installerFeuillesPassees(tech);          // rechargement de l'appli
    ok('5. un rechargement ne repose rien', nbEcritures === 0, nbEcritures + ' ecriture(s)');
    ok('5. la semaine effacee reste effacee',
       magasin3.get('fh_' + tech + '_2026_34').chantierLines.length === 0);
    // CONTRE-EXEMPLE : sans le registre, elle reviendrait
    magasin3.delete(CLE_SEED_FEUILLES);
    nbEcritures = 0;
    await installerFeuillesPassees(tech);
    ok('5. CONTRE-EXEMPLE : sans le registre, elle reviendrait bien', nbEcritures > 0
       && magasin3.get('fh_' + tech + '_2026_34').chantierLines.length === 1, nbEcritures + ' ecriture(s)');

    /* ---- 5 bis. UNE FEUILLE CORRIGEE APRES SA POSE ATTEINT QUAND MEME LE
       TELEPHONE, ET SEULEMENT SI PERSONNE N'Y A TOUCHE.
       La version du 09/09 au soir posait la S34 de Benjamin DIRAT en QUATRE
       lignes ; Patrice a demande le lendemain de les regrouper. Sans ce
       chemin, la correction n'atteignait que les telephones qui n'avaient pas
       encore recu la mise a jour. Mais elle ne doit JAMAIS passer par-dessus
       une saisie : c'est le contre-exemple qui compte ici. */
    const cleD = 'fh_Benjamin DIRAT_2026_34';
    const corrD = SEED_FEUILLES_CORRIGEES.find(c => c.tech === 'Benjamin DIRAT' && c.semaine === 34);
    ok('5bis. la feuille corrigee est bien declaree', !!corrD);
    const neuveD = SEED_FEUILLES.find(s => s.tech === 'Benjamin DIRAT' && s.semaine === 34);
    ok('5bis. la version en service est regroupee sur UNE ligne',
       neuveD.feuille.chantierLines.length === 1,
       neuveD.feuille.chantierLines.map(l => l.nom).join(' | '));
    ok('5bis. les quatre libelles y sont tous, et les heures ne bougent pas',
       ['Avarie arudy','Le hourat','Fin de semaine','Poste de Portet']
         .every(m => neuveD.feuille.chantierLines[0].nom.indexOf(m) !== -1)
       && neuveD.feuille.chantierLines[0].jours[0].j === 11
       && neuveD.feuille.chantierLines[0].jours[4].j === 7);
    // le telephone porte l'ANCIENNE pose (4 lignes), registre en version 1
    const magasinC = new Map(); nbEcritures = 0;
    kvGet = async (k) => (magasinC.has(k) ? JSON.parse(JSON.stringify(magasinC.get(k))) : null);
    kvSet = async (k, v) => { nbEcritures++; magasinC.set(k, JSON.parse(JSON.stringify(v))); return true; };
    const posePrecedente = () => {
      const f = JSON.parse(JSON.stringify(corrD.avant));
      f.removedAutoIds = []; f.envoyeLe = '2026-08-25T17:44:00';
      magasinC.set(cleD, f);
      magasinC.set(CLE_SEED_FEUILLES, {[cleD]: 1});
    };
    posePrecedente();
    await installerFeuillesPassees('Benjamin DIRAT');
    ok('5bis. la feuille posee par la version d\'avant est corrigee',
       magasinC.get(cleD).chantierLines.length === 1,
       JSON.stringify(magasinC.get(cleD).chantierLines.map(l => l.nom)));
    ok('5bis. le registre passe en version ' + SEED_FEUILLES_VERSION,
       magasinC.get(CLE_SEED_FEUILLES)[cleD] === SEED_FEUILLES_VERSION);
    nbEcritures = 0;
    await installerFeuillesPassees('Benjamin DIRAT');
    ok('5bis. un rechargement de plus ne reecrit rien', nbEcritures === 0, nbEcritures + ' ecriture(s)');
    // CONTRE-EXEMPLE : le technicien a change UNE heure -> on ne touche a rien
    posePrecedente();
    const sienneD = magasinC.get(cleD);
    sienneD.chantierLines[1].jours[2].j = 9;
    magasinC.set(cleD, sienneD);
    await installerFeuillesPassees('Benjamin DIRAT');
    ok('5bis. CONTRE-EXEMPLE : une heure modifiee depuis la pose bloque la correction',
       magasinC.get(cleD).chantierLines.length === 4
       && magasinC.get(cleD).chantierLines[1].jours[2].j === 9,
       magasinC.get(cleD).chantierLines.length + ' ligne(s)');
    // CONTRE-EXEMPLE : un simple commentaire ajoute suffit a bloquer
    posePrecedente();
    const avecCom = magasinC.get(cleD); avecCom.commentaires = 'RAS'; magasinC.set(cleD, avecCom);
    await installerFeuillesPassees('Benjamin DIRAT');
    ok('5bis. CONTRE-EXEMPLE : un commentaire ajoute bloque aussi',
       magasinC.get(cleD).chantierLines.length === 4 && magasinC.get(cleD).commentaires === 'RAS');
    // l'empreinte ignore ce que l'appli recalcule elle-meme
    posePrecedente();
    const avecAuto = magasinC.get(cleD);
    avecAuto.removedAutoIds = ['c_9g5cqsuj']; avecAuto.envoyeLe = '2026-09-01T08:00:00';
    magasinC.set(cleD, avecAuto);
    await installerFeuillesPassees('Benjamin DIRAT');
    ok('5bis. removedAutoIds et envoyeLe ne comptent pas comme une saisie',
       magasinC.get(cleD).chantierLines.length === 1);
    // une feuille NON corrigee posee en version 1 n'est pas reecrite pour autant
    const magasinV = new Map(); nbEcritures = 0;
    kvGet = async (k) => (magasinV.has(k) ? JSON.parse(JSON.stringify(magasinV.get(k))) : null);
    kvSet = async (k, v) => { nbEcritures++; magasinV.set(k, JSON.parse(JSON.stringify(v))); return true; };
    const cleA = 'fh_Anthony DENIS_2026_34';
    magasinV.set(cleA, {chantierLines: [], removedAutoIds: [], absences: [], pd: {}, gd: {},
                        nacelle: {}, vehiculeMode: null, km: '', immat: '', commentaires: ''});
    magasinV.set(CLE_SEED_FEUILLES, {[cleA]: 1});
    await installerFeuillesPassees('Anthony DENIS');
    ok('5bis. une semaine effacee et posee en v1 ne revient PAS avec la v2',
       magasinV.get(cleA).chantierLines.length === 0);

    // ---- 6. CE QUI EST POSE RESSORT A L'IDENTIQUE DANS LA FEUILLE OFFICIELLE ----
    /* On repasse chaque feuille posee dans `buildExportPayload` - le code qui
       fabrique le PDF et le classeur - et on compare heure par heure. C'est ce
       qui prouve que le format pose est bien celui que l'appli sait relire, et
       pas seulement un objet qui s'affiche. */
    let ecartsRoundTrip = 0, detailEcart = '';
    const totalJour = (f) => {
      const t = [0, 0, 0, 0, 0, 0, 0];
      (f.chantierLines || []).forEach(l => Object.keys(l.jours || {}).forEach(d => {
        t[d] += (parseFloat(l.jours[d].j) || 0) + (parseFloat(l.jours[d].n) || 0);
      }));
      (f.absences || []).forEach(a => Object.keys(a.jours || {}).forEach(d => { t[d] += parseFloat(a.jours[d]) || 0; }));
      return t.join(',');
    };
    for (const s of SEED_FEUILLES) {
      currentTech = s.tech;
      hoursEntry = JSON.parse(JSON.stringify(s.feuille));
      const p = buildExportPayload(new Date(Date.UTC(2026, 7, 17)), s.semaine);
      const attendu = totalJour(s.feuille);
      const obtenu = totalJour(p);
      const memeVehicule = (p.vehiculeMode || null) === (s.feuille.vehiculeMode || null);
      const memeKm = String(p.km || '') === String(s.feuille.km || '');
      const memeImmat = String(p.immat || '') === String(s.feuille.immat || '');
      if (attendu !== obtenu || !memeVehicule || !memeKm || !memeImmat) {
        ecartsRoundTrip++;
        if (!detailEcart) detailEcart = s.tech + ' S' + s.semaine + ' : ' + attendu + ' vs ' + obtenu;
      }
    }
    ok('6. les feuilles ressortent a l\'identique dans la feuille officielle',
       ecartsRoundTrip === 0, ecartsRoundTrip ? detailEcart : ('0 ecart sur ' + SEED_FEUILLES.length));
    // CONTRE-EXEMPLE : une heure changee dans la feuille posee DOIT etre vue
    currentTech = 'Anthony DENIS';
    hoursEntry = JSON.parse(JSON.stringify(SEED_FEUILLES.find(s => s.tech === 'Anthony DENIS' && s.semaine === 35).feuille));
    const refTotaux = totalJour(hoursEntry);
    hoursEntry.chantierLines[0].jours[0].j = 6;
    ok('6. CONTRE-EXEMPLE : une heure modifiee change bien le total',
       totalJour(buildExportPayload(new Date(Date.UTC(2026, 7, 24)), 35)) !== refTotaux);
    // le numero d'index du chantier suit, c'est lui qui identifie l'affaire au recap RH
    hoursEntry = JSON.parse(JSON.stringify(SEED_FEUILLES.find(s => s.tech === 'Anthony DENIS' && s.semaine === 35).feuille));
    ok('6. le n° d\'affaire est retrouve par la fiche (26-051)',
       buildExportPayload(new Date(Date.UTC(2026, 7, 24)), 35).chantierLines[0].numero === '26-051');

    // ---- 7. l'ecran dit que la feuille est deja partie ----
    currentTech = 'Anthony DENIS';
    hoursEntry = JSON.parse(JSON.stringify(SEED_FEUILLES.find(s => s.tech === 'Anthony DENIS' && s.semaine === 35).feuille));
    renderHoursUI();
    const html1 = document.getElementById('hoursPanel').innerHTML;
    ok('7. la date d\'envoi est ecrite sous le bouton', html1.indexOf('Déjà envoyée le 28/08/2026') !== -1);
    // CONTRE-EXEMPLE : une semaine jamais envoyee n'affiche AUCUN reproche
    delete hoursEntry.envoyeLe;
    renderHoursUI();
    const html2 = document.getElementById('hoursPanel').innerHTML;
    ok('7. CONTRE-EXEMPLE : sans date d\'envoi, la phrase disparait',
       html2.indexOf('Déjà envoyée') === -1 && html2.indexOf('jamais envoyée') === -1);

    /* ---- 8. LA FEUILLE ENVOYÉE REVIENT DANS L'APPLI (06/10/2026) ----
       Signalé par Patrice : depuis la S39, les cases restaient vides après
       l'envoi. On joue le vrai chemin (`ensureFeuilleForWeek`) avec une session
       et un serveur simulés. Ce qui compte ici, ce sont les contre-exemples :
       la reprise ne passe JAMAIS par-dessus une saisie ni après un « Effacer ». */
    const totalEnvoi = (p) => {
      const t = [0, 0, 0, 0, 0, 0, 0];
      (p.chantierLines || []).forEach(l => Object.keys(l.jours || {}).forEach(d => {
        t[d] += (parseFloat(l.jours[d].j) || 0) + (parseFloat(l.jours[d].n) || 0); }));
      (p.absences || []).forEach(a => Object.keys(a.jours || {}).forEach(d => { t[d] += parseFloat(a.jours[d]) || 0; }));
      return t.join(',');
    };
    // 8a. aller-retour : la saisie partie, remise au format de l'appli puis renvoyee, donne les memes heures
    let ecartsEnvoi = 0, detailEnvoi = '';
    for (const s of SEED_FEUILLES.filter(x => x.source === 'envoi')) {
      currentTech = s.tech;
      hoursEntry = JSON.parse(JSON.stringify(s.feuille));
      const p = buildExportPayload(mondayOfISOWeek(s.semaine, s.annee), s.semaine);
      const ok1 = totalEnvoi(p) === totalEnvoi(s.envoi)
        && JSON.stringify(p.pd) === JSON.stringify(s.envoi.pd || {})
        && JSON.stringify(p.gd) === JSON.stringify(s.envoi.gd || {})
        && String(p.commentaires || '') === String(s.envoi.commentaires || '')
        && p.chantierLines.map(l => l.numero).join('|') === (s.envoi.chantierLines || []).map(l => l.numero || '').join('|');
      if (!ok1) { ecartsEnvoi++; if (!detailEnvoi) detailEnvoi = s.tech + ' S' + s.semaine + ' : ' + totalEnvoi(p) + ' vs ' + totalEnvoi(s.envoi); }
    }
    ok('8a. les feuilles S39+ ressortent comme elles sont parties (heures, PD, GD, n° d\'affaire, commentaire)',
       ecartsEnvoi === 0, ecartsEnvoi ? detailEnvoi : '0 ecart');
    // 8b. la mention paternite calculee a l'envoi ne s'empile pas dans le commentaire
    currentTech = 'Benjamin SOUPA';
    hoursEntry = JSON.parse(JSON.stringify(SEED_FEUILLES.find(s => s.tech === 'Benjamin SOUPA' && s.semaine === 35).feuille));
    hoursEntry.commentaires = 'RAS';
    const pPat = buildExportPayload(mondayOfISOWeek(35, 2026), 35);
    const retour = feuilleDepuisEnvoi(pPat, '2026-09-07T13:54:00Z');
    ok('8b. la mention paternite est retiree, le commentaire du technicien reste',
       retour.commentaires === 'RAS' && pPat.commentaires !== 'RAS', JSON.stringify(retour.commentaires));
    // 8c. le vrai chemin, avec une session et un serveur simules
    const sessionAvant = SESSION_SUIVI, fetchAvant = window.fetch, offsetAvant = currentOffset;
    const magasin8 = new Map();
    kvGet = async (k) => (magasin8.has(k) ? JSON.parse(JSON.stringify(magasin8.get(k))) : null);
    kvSet = async (k, v) => { magasin8.set(k, JSON.parse(JSON.stringify(v))); return true; };
    const ref = SEED_FEUILLES.find(s => s.source === 'envoi' && s.tech === 'Anthony DENIS' && s.semaine === 40);
    let demandes = [];
    window.fetch = async (url) => {
      demandes.push(String(url));
      return { ok: true, json: async () => ({ feuille: JSON.parse(JSON.stringify(ref.envoi)), recuLe: '2026-10-02T06:10:23Z', origine: 'base' }) };
    };
    try {
      SESSION_SUIVI = { nom: 'Anthony DENIS', role: 'tech', mail: 'x' };
      currentTech = 'Anthony DENIS'; currentOffset = 0;
      const w = weekRange(0);
      const cle = 'fh_Anthony DENIS_' + w.year + '_' + w.weekNum;
      await ensureFeuilleForWeek('Anthony DENIS', w);
      ok('8c. semaine vide : la feuille envoyee revient, avec ses heures',
         totalEnvoi(hoursEntry) === totalEnvoi(feuilleDepuisEnvoi(ref.envoi)) && totalEnvoi(hoursEntry) !== '0,0,0,0,0,0,0',
         totalEnvoi(hoursEntry));
      ok('8c. elle se sait deja envoyee', hoursEntry.envoyeLe === '2026-10-02T06:10:23Z', hoursEntry.envoyeLe || 'aucune date');
      ok('8c. elle est gardee sur le telephone', magasin8.has(cle) && !feuilleVierge(magasin8.get(cle)));
      ok('8c. la question porte sur CE technicien et CETTE semaine',
         demandes.length === 1 && demandes[0].indexOf('tech=Anthony%20DENIS') !== -1
         && demandes[0].indexOf('annee=' + w.year) !== -1 && demandes[0].indexOf('semaine=' + w.weekNum) !== -1, demandes[0]);
      // CONTRE-EXEMPLE : une saisie sur le telephone n'est jamais remplacee, et le serveur n'est pas interroge
      demandes = [];
      magasin8.set(cle, { chantierLines: [{ id: null, nom: 'MA SAISIE', lieu: '', client: '', jours: { 0: { j: 3 } } }],
                          removedAutoIds: [], absences: [], pd: {}, gd: {}, nacelle: {}, vehiculeMode: null, km: '', immat: '', commentaires: '' });
      await ensureFeuilleForWeek('Anthony DENIS', w);
      ok('8c. CONTRE-EXEMPLE : une saisie du telephone reste intacte',
         hoursEntry.chantierLines.some(l => l.nom === 'MA SAISIE') && demandes.length === 0,
         JSON.stringify(hoursEntry.chantierLines.map(l => l.nom)) + ' / ' + demandes.length + ' demande(s)');
      // CONTRE-EXEMPLE : une semaine effacee par le technicien ne revient pas
      magasin8.set(cle, { chantierLines: [], removedAutoIds: [], absences: [], pd: {}, gd: {}, nacelle: {},
                          vehiculeMode: null, km: '', immat: '', commentaires: '', effaceeLe: '2026-10-06T10:00:00Z' });
      await ensureFeuilleForWeek('Anthony DENIS', w);
      ok('8c. CONTRE-EXEMPLE : une semaine effacee reste vide', feuilleVierge(hoursEntry) && demandes.length === 0);
      // CONTRE-EXEMPLE : sans session (ancienne adresse), rien n'est demande
      magasin8.delete(cle); SESSION_SUIVI = null;
      await ensureFeuilleForWeek('Anthony DENIS', w);
      ok('8c. CONTRE-EXEMPLE : sans session, aucune demande et la semaine reste vide',
         demandes.length === 0 && feuilleVierge(hoursEntry));
      // un serveur qui ne repond pas laisse la semaine vide, sans erreur
      SESSION_SUIVI = { nom: 'Anthony DENIS', role: 'tech', mail: 'x' };
      window.fetch = async () => { throw new Error('reseau'); };
      _reponsesBureau.clear();   // la réponse d'avant est gardée 20 s : on la retire pour jouer la panne
      magasin8.delete(cle);
      await ensureFeuilleForWeek('Anthony DENIS', w);
      ok('8c. serveur muet : la semaine s\'ouvre vide, sans erreur', feuilleVierge(hoursEntry));
    } finally {
      SESSION_SUIVI = sessionAvant; window.fetch = fetchAvant; currentOffset = offsetAvant;
    }

    /* ---- 9. LE VERROU ET CE QUE LE BUREAU A CHANGÉ (06/10/2026) ----
       Patrice : feuilles non modifiables par le technicien une fois le mois
       validé ; le bureau peut les modifier (atelier) et le technicien en est
       informé ; idem pour une correction de sa fiche de paie. */
    const sess9 = SESSION_SUIVI, fetch9 = window.fetch, mode9 = accessMode, alert9 = window.alert, off9 = currentOffset;
    const magasin9 = new Map(); let ecritures9 = 0;
    kvGet = async (k) => (magasin9.has(k) ? JSON.parse(JSON.stringify(magasin9.get(k))) : null);
    kvSet = async (k, v) => { ecritures9++; magasin9.set(k, JSON.parse(JSON.stringify(v))); return true; };
    let reponse9 = null, demandes9 = 0;
    window.fetch = async () => { demandes9++; return { ok: true, json: async () => JSON.parse(JSON.stringify(reponse9)) }; };
    window.alert = () => {};
    try {
      SESSION_SUIVI = { nom: 'Anthony DENIS', role: 'tech', mail: 'x' };
      accessMode = 'tech'; currentTech = 'Anthony DENIS'; currentOffset = 0;
      const w9 = weekRange(0);
      const cle9 = 'fh_Anthony DENIS_' + w9.year + '_' + w9.weekNum;
      const sienne9 = () => ({ chantierLines: [{ id: null, nom: 'MA SAISIE', lieu: '', client: '', jours: { 0: { j: 7 } } }],
        removedAutoIds: [], absences: [], pd: { 0: 1 }, gd: {}, nacelle: {}, interventions: [], vehiculeMode: null,
        km: '', immat: '', commentaires: '', envoyeLe: '2026-10-05T08:00:00.000Z' });
      const ouvrir = async () => {
        _reponsesBureau.clear();
        await ensureFeuilleForWeek('Anthony DENIS', w9);
        renderHoursUI();
        await majDepuisBureau('Anthony DENIS', w9, cle9);
      };
      const panneau = () => document.getElementById('hoursPanel');
      const figes = () => [...panneau().querySelectorAll('input, textarea, button')].filter(b => b.disabled).length;
      const libresListe = () => [...panneau().querySelectorAll('input, textarea, button')].filter(b => !b.disabled && b.id !== 'excelBtn' && !b.closest('#rappelSuivi') && !/Epingle/.test(b.getAttribute('onclick') || ''));
      const libres = () => libresListe().length;

      // 9a. le verrou
      magasin9.set(cle9, sienne9());
      reponse9 = { base: 'ok', feuille: null, verrou: { periode: '2026-10', par: 'Patrice PIVOT', le: '2026-10-20T09:00:00Z' }, bureau: null, paie: null };
      await ouvrir();
      ok('9a. mois validé : la feuille le dit', /validée par le bureau/.test(panneau().innerHTML) && /ne se modifie plus/.test(panneau().innerHTML));
      ok('9a. mois validé : rien ne se modifie (cases et boutons figés)', figes() > 5 && libres() === 0, figes() + ' figés, libres : ' + libresListe().map(b => b.outerHTML.slice(0, 80)).join(' ; '));
      ok('9a. le fichier Excel reste téléchargeable', !document.getElementById('excelBtn').disabled);
      ok('9a. la saisie du téléphone reste affichée', hoursEntry.chantierLines.some(l => l.nom === 'MA SAISIE'));
      ok('9a. le verrou est gardé sur la feuille (il tient hors réseau)', !!(magasin9.get(cle9) || {}).verrouBureau);
      ecritures9 = 0; hoursEntry.commentaires = 'triche'; await sauverHeures();
      ok('9a. une écriture forcée ne passe pas', ecritures9 === 0 && magasin9.get(cle9).commentaires === '');
      const envois9 = demandes9; await emailFeuille();
      ok('9a. l\'envoi est refusé', demandes9 === envois9 && !magasin9.get(cle9).envoiEnAttente);
      // CONTRE-EXEMPLE : l'accès atelier du bureau garde la main
      accessMode = 'admin';
      renderHoursUI();
      ok('9a. CONTRE-EXEMPLE : en accès atelier, la feuille reste modifiable', libres() > 5 && /le technicien ne peut plus la modifier/.test(panneau().innerHTML), libres() + ' libres');
      accessMode = 'tech';
      // CONTRE-EXEMPLE : mois dévalidé => la feuille se rouvre
      reponse9 = { base: 'ok', feuille: null, verrou: null, bureau: null, paie: null };
      await ouvrir();
      ok('9a. CONTRE-EXEMPLE : validation retirée au bureau, la feuille se rouvre', !hoursEntry.verrouBureau && libres() > 5 && !/validée par le bureau/.test(panneau().innerHTML));

      // 9b. le bureau a modifié la feuille depuis l'atelier
      magasin9.clear(); magasin9.set(cle9, sienne9());
      const versionBureau = JSON.parse(JSON.stringify(ref.envoi));
      reponse9 = { base: 'ok', feuille: versionBureau, recuLe: '2026-10-07T10:12:00.000Z', origine: 'base',
                   bureau: { par: 'Patrice PIVOT', le: '2026-10-07T10:12:00.000Z' }, verrou: null, paie: null };
      await ouvrir();
      ok('9b. la version du bureau remplace celle du téléphone', totalEnvoi(hoursEntry) === totalEnvoi(feuilleDepuisEnvoi(versionBureau))
         && !hoursEntry.chantierLines.some(l => l.nom === 'MA SAISIE'), totalEnvoi(hoursEntry));
      ok('9b. la feuille dit que le bureau l\'a modifiée, quand et qui',
         /Le bureau a modifié cette feuille le 07\/10/.test(panneau().innerHTML) && /Patrice PIVOT/.test(panneau().innerHTML));
      ok('9b. l\'ancienne saisie du téléphone est gardée à part (jamais perdue)',
         (magasin9.get('avant_bureau_' + cle9) || { chantierLines: [] }).chantierLines.some(l => l.nom === 'MA SAISIE'));
      ok('9b. la sauvegarde ne compte pas comme une feuille (pas de préfixe fh_)', !('avant_bureau_' + cle9).startsWith('fh_'));
      const apres = JSON.stringify(magasin9.get(cle9)); ecritures9 = 0;
      await ouvrir();
      ok('9b. rouvrir ne refait pas le remplacement', ecritures9 <= 1 && JSON.stringify(magasin9.get(cle9)) === apres);
      // CONTRE-EXEMPLE : la propre version de l'atelier, reçue juste après son envoi, ne se remplace pas elle-même
      magasin9.clear(); magasin9.set(cle9, Object.assign(sienne9(), { envoyeLe: '2026-10-07T10:11:30.000Z' }));
      await ouvrir();
      ok('9b. CONTRE-EXEMPLE : envoi du téléphone dans les 2 minutes : pas de remplacement', hoursEntry.chantierLines.some(l => l.nom === 'MA SAISIE'));
      // CONTRE-EXEMPLE : une version envoyée par le technicien lui-même ne déclenche rien
      magasin9.clear(); magasin9.set(cle9, sienne9());
      reponse9 = Object.assign({}, reponse9, { bureau: null });
      await ouvrir();
      ok('9b. CONTRE-EXEMPLE : sa propre version sur le serveur ne remplace pas son téléphone', hoursEntry.chantierLines.some(l => l.nom === 'MA SAISIE')
         && !/Le bureau a modifié/.test(panneau().innerHTML));

      // 9c. la fiche de paie corrigée au bureau
      magasin9.clear(); magasin9.set(cle9, sienne9());
      reponse9 = { base: 'ok', feuille: null, verrou: null, bureau: null,
                   paie: { periode: '2026-09', le: '2026-10-03T14:00:00Z', par: 'Carine RAMBAUD',
                           corrections: { gd: 18, absences: [{ type: 'conges', du: '2026-09-01', au: '2026-09-05', jours: 5 }] } } };
      await ouvrir();
      const h9 = panneau().innerHTML;
      ok('9c. la correction de paie est dite, avec le mois', /Le bureau a corrigé ta paie de septembre 2026/.test(h9), h9.slice(0, 0));
      ok('9c. et son contenu : GD et absence datée', /GD 18 j/.test(h9) && /Congés du 01\/09 au 05\/09 \(5 j\)/.test(h9));
      ok('9c. une correction de paie ne fige rien', libres() > 5);
      // 9d. base muette : on ne sait pas, on ne dit rien et on ne retire rien
      magasin9.set(cle9, Object.assign(sienne9(), { verrouBureau: { periode: '2026-10', par: 'X', le: '' } }));
      reponse9 = { base: 'muette', feuille: null, verrou: null, bureau: null, paie: null };
      await ouvrir();
      ok('9d. base muette : le verrou déjà connu tient', !!hoursEntry.verrouBureau && libres() === 0);
    } finally {
      SESSION_SUIVI = sess9; window.fetch = fetch9; accessMode = mode9; window.alert = alert9; currentOffset = off9;
    }

    fin();
  } catch (e) {
    R.push('EXCEPTION : ' + (e && e.message ? e.message : e));
    ko++; fin();
  }
})();
</script>
