<pre id="verdictTest" style="position:fixed;top:0;left:0;background:#fff;color:#000;z-index:99999;font:11px monospace;padding:4px;">en cours</pre>
<script>
/* TEST DES HEURES SUP / INTERVENTION (demande de la paie, 28/09/2026).
 * A concatener apres index.html, Chrome --headless --dump-dom.
 *
 * Le technicien saisit une ligne par intervention : reference, date, heure de
 * depart, heure de fin. Le nombre d'heures SE CALCULE (une fin avant le depart
 * = on a passe minuit). Seules les lignes completes partent, et l'envoi le dit
 * avant de laisser partir une ligne incomplete. */
(async function () {
  const R = []; let ko = 0;
  function ok(nom, cond, detail) {
    R.push((cond ? 'OK   ' : 'ECHEC') + ' | ' + nom + (detail ? '  -> ' + detail : ''));
    if (!cond) ko++;
  }
  function fin() {
    R.push('---');
    R.push(R.filter(l => l.startsWith('OK')).length + ' controle(s) passes, ' + ko + ' en echec');
    R.push(ko ? 'VERDICT: ECHEC' : 'VERDICT: TOUT PASSE');
    document.getElementById('verdictTest').textContent = R.join('\n');
  }
  try {
    for (let i = 0; i < 100 && typeof renderHoursUI === 'undefined'; i++) await new Promise(r => setTimeout(r, 50));
    if (typeof heuresIntervention === 'undefined') { ok('la page porte les interventions', false); fin(); return; }

    // ---- 1. le calcul des heures ----
    ok('1. 18:00 -> 21:30 = 3,5 h', heuresIntervention({ debut: '18:00', fin: '21:30' }) === 3.5);
    ok('1. 22:00 -> 02:00 = 4 h (on passe minuit)', heuresIntervention({ debut: '22:00', fin: '02:00' }) === 4);
    ok('1. 07:15 -> 08:05 = 0,83 h', heuresIntervention({ debut: '07:15', fin: '08:05' }) === 0.83);
    ok('1. CONTRE-EXEMPLE : depart = fin, ou heure absente : rien (pas zero)',
       heuresIntervention({ debut: '10:00', fin: '10:00' }) === null && heuresIntervention({ debut: '10:00', fin: '' }) === null);

    // ---- 2. ce qui part dans la feuille ----
    currentTech = TECHS.find(t => TECHS_SANS_CHANTIER.indexOf(t) === -1) || TECHS[0];
    currentOffset = 0;
    const wk = weekRange(0);
    const lun = wk.mon.toISOString().slice(0, 10);
    hoursEntry = { chantierLines: [], removedAutoIds: [], absences: [], pd: {}, gd: {}, nacelle: {}, vehiculeMode: null, km: '', immat: '', commentaires: '',
      interventions: [
        { ref: '26-051', date: lun, debut: '20:00', fin: '23:30' },
        { ref: 'incomplete', date: lun, debut: '20:00', fin: '' },
      ] };
    const p = buildExportPayload(wk.mon, wk.weekNum);
    ok('2. seule l intervention complete part, avec ses heures calculees',
       Array.isArray(p.interventions) && p.interventions.length === 1 && p.interventions[0].ref === '26-051'
       && p.interventions[0].heures === 3.5 && p.interventions[0].date === lun, JSON.stringify(p.interventions));
    hoursEntry.interventions = undefined;
    ok('2. CONTRE-EXEMPLE : une feuille d avant (sans le champ) part avec une liste vide', JSON.stringify(buildExportPayload(wk.mon, wk.weekNum).interventions) === '[]');

    // ---- 3. l ecran ----
    hoursEntry.interventions = [];
    renderHoursUI();
    const panel = document.getElementById('hoursPanel');
    ok('3. la rubrique « Heures sup / intervention » est dans la feuille', /Heures sup \/ intervention/.test(panel.textContent));
    addIntervention();
    const dates = panel.querySelectorAll('input[type=date]'), heures = panel.querySelectorAll('input[type=time]');
    ok('3. « Ajouter une intervention » pose une ligne : reference, date, depart, fin', hoursEntry.interventions.length === 1
       && dates.length === 1 && heures.length === 2 && !!panel.querySelector('input[list=intervRefs]'));
    ok('3. la date est bornee a la semaine de la feuille', dates[0].min === lun && dates[0].max === wk.sun.toISOString().slice(0, 10));
    updateIntervention(0, 'debut', '21:00'); updateIntervention(0, 'fin', '01:30');
    ok('3. les heures s affichent toutes seules (« 4,5 h »)', document.getElementById('intervH0').textContent === '4,5 h');
    removeIntervention(0);
    ok('3. la ligne se retire', hoursEntry.interventions.length === 0 && !panel.querySelector('input[type=time]'));

    // ---- 4. l envoi previent d une ligne incomplete ----
    hoursEntry.interventions = [{ ref: 'x', date: lun, debut: '', fin: '' }];
    const questions = [];
    const vraiConfirm = window.confirm;
    // La feuille est vide : on laisse passer cette question-là, on refuse celle des interventions.
    window.confirm = (q) => { questions.push(q); return !/intervention/.test(q); };
    try { await emailFeuille(); } catch (e) {}
    window.confirm = vraiConfirm;
    const question = questions.find(q => /intervention/.test(q)) || '';
    ok('4. une intervention incomplete : l envoi le demande avant de partir', /intervention n.est pas compl.te/.test(question), questions.map(q => q.slice(0, 40)).join(' | '));
  } catch (e) { ok('le banc a plante', false, e && (e.stack || e.message)); }
  fin();
})();
</script>
