<pre id="verdictTest" style="position:fixed;top:0;left:0;background:#fff;z-index:99999;font:11px monospace;">en cours</pre>
<script>
/* LA CONTRIBUTION AGENCE POSEE AU PLANNING (30/09/2026). A concatener apres
 * index.html, servi en http (IndexedDB). Un technicien FICTIF, jamais un vrai nom.
 *
 * CE QUE CE BANC PROTEGE :
 * 1. le planning dit « agence » cette semaine ⇒ la ligne s'ajoute d'office ;
 * 2. une autre semaine ⇒ rien ;
 * 3. le planning la retire et rien n'est saisi ⇒ elle part ;
 * 4. des heures y sont saisies ⇒ elle RESTE, meme si le planning change ;
 * 5. retiree par le technicien ⇒ elle ne revient pas ;
 * 6. une case du bureau (/api/terrain) ajoute ou retire le jour.
 * Chaque controle a son contre-exemple dans le suivant. */
(async function(){
  const R=[]; let ko=0;
  const ok=(n,c,d)=>{R.push((c?'OK   ':'ECHEC')+' | '+n+(d?'  -> '+d:'')); if(!c) ko++;};
  try {
    for(let i=0;i<60 && typeof ensureFeuilleForWeek!=='function';i++) await new Promise(r=>setTimeout(r,100));
    const T = 'Essai FICTIF-BANC';
    const ID = '__contribution_agence__';
    const wi = weekRange(0);
    const lun = wi.mon.toISOString().slice(0,10);
    const mar = new Date(wi.mon.getTime()+86400000).toISOString().slice(0,10);
    const ids = () => hoursEntry.chantierLines.map(l=>l.id);
    const sauve = PLANNING_TECH.agence;
    PLANNING_TECH.agence = {}; PLANNING_TECH.agence[T] = [lun, mar];

    await ensureFeuilleForWeek(T, wi);
    const l1 = hoursEntry.chantierLines.find(l=>l.id===ID);
    ok('1. la ligne « Contribution agence » est ajoutee d\'office', !!l1 && l1.duPlanning===true && !l1.addedManually, ids().join(','));
    await ensureFeuilleForWeek(T, weekRange(1));
    ok('2. contre-exemple : la semaine suivante, sans agence, n\'a pas la ligne', ids().indexOf(ID)===-1, ids().join(','));

    PLANNING_TECH.agence[T] = [];
    await ensureFeuilleForWeek(T, wi);
    ok('3. le planning la retire, rien de saisi : la ligne part', ids().indexOf(ID)===-1, ids().join(','));

    PLANNING_TECH.agence[T] = [lun];
    await ensureFeuilleForWeek(T, wi);
    hoursEntry.chantierLines.find(l=>l.id===ID).jours = {'0':{j:7}};
    await kvSet(hoursKeyCurrent, hoursEntry);
    PLANNING_TECH.agence[T] = [];
    await ensureFeuilleForWeek(T, wi);
    ok('4. des heures saisies : la ligne RESTE apres le retrait au planning', ids().indexOf(ID)!==-1, ids().join(','));

    hoursEntry.chantierLines = hoursEntry.chantierLines.filter(l=>l.id!==ID);
    hoursEntry.removedAutoIds.push(ID);
    await kvSet(hoursKeyCurrent, hoursEntry);
    PLANNING_TECH.agence[T] = [lun];
    await ensureFeuilleForWeek(T, wi);
    ok('5. retiree par le technicien : elle ne revient pas', ids().indexOf(ID)===-1, ids().join(','));

    TECHS.push(T);
    const n = appliquerPlanningDuBureau([
      { jour: mar, personne: T, chantier: false, numero: null, agence: true, le: new Date().toISOString() },
      { jour: lun, personne: T, chantier: false, numero: null, agence: false, le: new Date().toISOString() }]);
    TECHS.pop();
    ok('6. une case du bureau ajoute le jour, une autre le retire', n===2 && JSON.stringify(PLANNING_TECH.agence[T])===JSON.stringify([mar]),
       JSON.stringify(PLANNING_TECH.agence[T]));

    // Nettoyage : les deux feuilles fictives
    for(const o of [0,1]){ const w = weekRange(o); await kvSet('fh_'+T+'_'+w.year+'_'+w.weekNum, null); }
    PLANNING_TECH.agence = sauve;
  } catch(e) {
    ok('le banc a leve une exception', false, e && e.message ? e.message : String(e));
  }
  R.push('---', R.filter(l=>l.startsWith('OK')).length+' controle(s) passes, '+ko+' en echec', ko?'VERDICT: ECHEC':'VERDICT: TOUT PASSE');
  document.getElementById('verdictTest').textContent = R.join('\n');
})();
</script>
