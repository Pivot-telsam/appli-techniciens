<!-- BANC DE « LIRE ET SIGNER LE PDP » DANS APP TECH (02/10/2026). Se concatène APRÈS index.html
     et se SERT EN HTTP (le cadre de signature a besoin d'une vraie page) :
       cat index.html scripts/test-emargement.html > essai-emargement-apptech.html
     fetch est remplacé : rien ne part vers le suivi.
     A. pas de session du suivi (adresse publique) : pas de bouton ;
     B. une feuille repérée pour CET indice : bouton ambre ; un autre indice : rien ;
     C. le panneau : le bouton de signature reste éteint tant que le PDP n'est pas ouvert ET
        qu'aucune signature n'est dessinée ;
     D. l'envoi part avec le numéro, l'indice, l'ouverture et une image PNG — jamais un nom ;
     E. une fois signé : le bouton de la carte passe au gris avec la date ;
     F. un refus du suivi est DIT dans le panneau, qui reste ouvert. -->
<pre id="verdictTest" style="position:fixed;bottom:0;left:0;right:0;max-height:45vh;overflow:auto;background:#fff;color:#000;z-index:99999;font-size:12px">en cours</pre>
<script>
setTimeout(async function(){ try {
  const R=[]; const ok=(n,c,d)=>R.push((c?'OK   ':'ECHEC')+' | '+n+(d!==undefined&&d!==''?' -> '+d:''));
  const c = SEED_DATA.chantiers ? SEED_DATA.chantiers.find(x => x.numero === '26-068') : chantierById('c_la_bruges_galus_merignac_7e21ab');
  const fiche = c || chantierById('c_la_bruges_galus_merignac_7e21ab');
  ok('(la carte de Bruges - Galus existe, PDP ind.3)', !!fiche && indiceCourt(fiche.pdp.indice) === '3', fiche && fiche.pdp.indice);
  const carte = () => { const d = document.createElement('div'); d.innerHTML = renderCard(fiche, [], null, null); return d; };

  // A
  SESSION_SUIVI = null; accessMode = 'tech'; EMARGEMENT = null;
  ok('A. sans session du suivi, chargerEmargement ne demande rien', (await chargerEmargement()) === false);
  ok('A. et la carte n\'a pas de bouton', !carte().querySelector('.pdp-sign-row'));

  // B
  let envoi = null, refuser = false;
  const vraiFetch = window.fetch;
  window.fetch = async (u, o) => {
    if(String(u).indexOf('/api/emargement') === 0){
      if(o && o.method === 'POST'){
        envoi = JSON.parse(o.body);
        if(refuser) return new Response(JSON.stringify({ erreur:'sans_modele', message:'Ce PDP (indice 3) n\'a pas de feuille d\'émargement repérée.' }), { status:409 });
        return new Response(JSON.stringify({ ok:true, signeLe:'2026-10-05T05:41:00.000Z', remplacee:false }), { status:200 });
      }
      return new Response(JSON.stringify({ ok:true, modeles:[{ numero:'26-068', indice:'3', lignes:12, page:22 }], miennes:[],
        moi:{ nom:'Pascal BONAVENTURE', entreprise:'TELSAM', habilitation:'H2V-B2' } }), { status:200 });
    }
    return vraiFetch(u, o);
  };
  SESSION_SUIVI = { mail:'tech:pascalbonaventure', nom:'Pascal BONAVENTURE', role:'tech' }; accessMode = 'tech';
  ok('B. avec une session de technicien, la liste est lue', (await chargerEmargement()) === true);
  let b = carte().querySelector('.pdp-sign-row .doc-btn');
  ok('B. bouton ambre « Lire et signer le PDP ind.3 »', b && b.classList.contains('pdp-a-signer') && /Lire et signer le PDP ind\.3/.test(b.textContent), b && b.textContent);
  const avant = fiche.pdp;
  fiche.pdp = Object.assign({}, fiche.pdp, { indice:'4' });
  ok('B. contre-exemple : le PDP passe à l\'indice 4, pas de feuille repérée ⇒ pas de bouton', !carte().querySelector('.pdp-sign-row'));
  fiche.pdp = avant;
  accessMode = 'admin';
  ok('B. l\'accès atelier du bureau ne charge rien (il ne signe pas)', (await chargerEmargement()) === false);
  accessMode = 'tech'; await chargerEmargement();

  // C
  try{ sessionStorage.removeItem('em_ouvert|26-068|3'); }catch(e){}
  ouvrirEmargement(fiche.id);
  const ov = document.getElementById('suiviOverlay');
  const signer = () => document.getElementById('emSigner');
  ok('C. le panneau s\'ouvre, nom et habilitation préremplis', !!ov && /Signer le PDP ind\.3/.test(ov.textContent) && document.getElementById('emHab').value === 'H2V-B2');
  ok('C. éteint tant que rien n\'est fait', signer().disabled);
  const cv = document.getElementById('emCadre'); const bx = cv.getBoundingClientRect();
  const tracer = () => { const ev = (t, x, y) => cv.dispatchEvent(new PointerEvent(t, { clientX: bx.left + x, clientY: bx.top + y, pointerId: 1, bubbles: true }));
    ev('pointerdown', 20, 80); for(let i = 1; i <= 30; i++) ev('pointermove', 20 + i * 8, 80 + Math.sin(i / 3) * 30); ev('pointerup', 260, 80); };
  tracer();
  ok('C. une signature sans avoir ouvert le PDP : toujours éteint', signer().disabled);
  emEffacer();
  const lien = document.getElementById('emOuvrir');
  lien.addEventListener('click', ev => ev.preventDefault(), { capture: true });
  lien.click();
  ok('C. le PDP ouvert est noté', /PDP ouvert à/.test(document.getElementById('emOuvert').textContent));
  ok('C. ouvert mais rien de dessiné : toujours éteint', signer().disabled);
  tracer();
  ok('C. ouvert ET signé : le bouton s\'allume', !signer().disabled);

  // F (avant D : le refus laisse le panneau ouvert)
  refuser = true;
  await emEnvoyer(fiche.id);
  ok('F. un refus du suivi est dit, le panneau reste ouvert', !!document.getElementById('suiviOverlay') && /pas partie/.test(document.getElementById('emMsg').textContent), document.getElementById('emMsg').textContent);
  refuser = false;

  // D
  envoi = null;
  await emEnvoyer(fiche.id);
  ok('D. l\'envoi porte numéro, indice, arrivée, ouverture', envoi && envoi.action === 'signer' && envoi.numero === '26-068' && envoi.indice === '3'
     && /^\d{4}-\d{2}-\d{2}$/.test(envoi.arrivee) && !isNaN(Date.parse(envoi.ouvertLe)));
  ok('D. et une image PNG non vide', envoi && /^data:image\/png;base64,/.test(envoi.signature) && envoi.signature.length > 400, envoi && envoi.signature.length);
  ok('D. jamais un nom : c\'est la session qui le dit', envoi && envoi.nom === undefined && envoi.sujet === undefined);
  ok('D. le panneau se ferme', !document.getElementById('suiviOverlay'));

  // E
  b = carte().querySelector('.pdp-sign-row .doc-btn');
  ok('E. la carte dit « signé le » en gris', b && b.classList.contains('pdp-signe') && /PDP ind\.3 signé le 05\/10/.test(b.textContent), b && b.textContent);

  window.fetch = vraiFetch;
  const ko = R.filter(x => x.startsWith('ECHEC')).length;
  R.push(''); R.push(ko ? 'VERDICT : ' + ko + ' ECHEC(S)' : 'VERDICT : TOUT PASSE (' + (R.length - 1) + ' controles)');
  document.getElementById('verdictTest').textContent = R.join('\n');
} catch(e){ document.getElementById('verdictTest').textContent = 'BANC ARRETE : ' + (e && e.stack || e); } }, 3000);
</script>
